<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My PCB Repair Data</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f2f4f7;
    color:#222;
}

header{
    background:#1f2937;
    color:white;
    padding:25px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:27px;
}

header p{
    margin:8px 0 0;
}

.search{
    background:white;
    padding:15px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:10;
}

.search input{
    width:95%;
    max-width:600px;
    padding:14px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:8px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.folder{
    background:white;
    margin:12px 0;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
    cursor:pointer;
}

.folder:hover{
    transform:translateY(-2px);
}

.folder h2{
    margin:0;
    font-size:20px;
}

.folder p{
    margin:8px 0 0;
    color:#666;
}

.back{
    display:none;
    margin-bottom:15px;
    padding:12px 16px;
    background:#2563eb;
    color:white;
    border:0;
    border-radius:7px;
    font-size:16px;
}

.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

</style>
</head>

<body>

<header>

<h1>🔧 My PCB Repair Data</h1>

<p>
Personal PCB Repair Database
</p>

</header>


<div class="search">

<input
type="text"
id="searchBox"
placeholder="Search folders..."
autocomplete="off">

</div>


<div class="container">

<button
class="back"
id="backButton"
onclick="showMainFolders()">

← Back

</button>


<div id="folderList"></div>

</div>


<script>

/* =====================================
   MAIN CATEGORIES
===================================== */

const mainFolders = [

"AC PCB",
"Refrigerator PCB",
"Washing Machine PCB",
"Induction Cooktop",
"Chimney PCB"

];


/* =====================================
   COMMON SUBFOLDERS
===================================== */

const subFolders = [

"Circuit Diagrams",
"EEPROM BIN Files",
"Error Codes",
"Inverter AC",
"Non Inverter AC",
"PDF",
"Photos",
"Remote Photos",
"Sensor Details",
"Test Points"

];


/* =====================================
   DISPLAY
===================================== */

const folderList =
document.getElementById("folderList");

const backButton =
document.getElementById("backButton");

const searchBox =
document.getElementById("searchBox");


let currentFolders = mainFolders;


/* =====================================
   SHOW MAIN FOLDERS
===================================== */

function showMainFolders(){

    currentFolders = mainFolders;

    backButton.style.display="none";

    searchBox.value="";

    displayFolders();

}


/* =====================================
   SHOW SUBFOLDERS
===================================== */

function openFolder(folderName){

    currentFolders = subFolders;

    backButton.style.display="block";

    searchBox.value="";

    displayFolders(folderName);

}


/* =====================================
   DISPLAY FOLDERS
===================================== */

function displayFolders(parentName=""){

    folderList.innerHTML="";

    currentFolders.forEach(function(folder){

        const div =
        document.createElement("div");

        div.className="folder";

        div.innerHTML=`

        <h2>📁 ${folder}</h2>

        <p>
        ${parentName
        ? parentName+" → "+folder
        : "Open folder"}
        </p>

        `;


        if(currentFolders === mainFolders){

            div.onclick=function(){

                openFolder(folder);

            };

        }
        else{

            div.onclick=function(){

                alert(
                "This folder is ready for your files:\n\n"
                + parentName
                + " → "
                + folder
                );

            };

        }


        folderList.appendChild(div);

    });

}


/* =====================================
   SEARCH
===================================== */

searchBox.addEventListener(
"input",
function(){

    const text =
    this.value.trim().toLowerCase();

    const folders =
    document.querySelectorAll(".folder");

    folders.forEach(function(folder){

        const name =
        folder.innerText.toLowerCase();

        if(name.includes(text)){

            folder.style.display="block";

        }
        else{

            folder.style.display="none";

        }

    });

});


/* =====================================
   START
===================================== */

showMainFolders();

</script>

</body>
</html>
