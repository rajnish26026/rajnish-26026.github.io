/* =========================================================

========================================================= */

let currentNode = database;

/* =========================================================

========================================================= */

    document.getElementById("content");

    document.getElementById("backButton");

    document.getElementById("pathDisplay");

/* =========================================================
   OBJECT CHECK
========================================================= */

function isObject(value) {

    return value !== null &&
           typeof value === "object";

}


/* =========================================================
   UPDATE BROWSER HISTORY
========================================================= */

function updateHistory() {

    const encoded =
        encodeURIComponent(
            JSON.stringify(currentPath)
        );

    history.pushState(
        { path: currentPath.slice() },
        "",
        "#" + encoded
    );

}


/* =========================================================
   DISPLAY CURRENT FOLDER
========================================================= */

function displayCurrentFolder() {

    content.innerHTML = "";

    if (currentPath.length === 0) {

        pathDisplay.innerHTML =
            "📁 Home";

        backButton.style.display =
            "none";

    } else {

        pathDisplay.innerHTML =
            "📁 " +
            currentPath
                .map(escapeHTML)
                .join(" → ");

        backButton.style.display =
            "inline-block";

    }


    const keys =
        Object.keys(currentNode);


    if (keys.length === 0) {

        content.innerHTML = `

            <div class="file-placeholder">

                📂 This folder is currently empty.

            </div>

        `;

        return;

    }


    keys.forEach(function(name) {

        createFolderElement(
            name,
            currentNode[name]
        );

    });

}


/* =========================================================
   CREATE FOLDER
========================================================= */

function createFolderElement(name, node) {

    const folder =
        document.createElement("div");

    folder.className = "folder";


    folder.innerHTML = `

        <div class="folder-title">

            📁 ${escapeHTML(name)}

        </div>

    `;


    folder.onclick = function() {

        currentNode = node;

        currentPath.push(name);

        updateHistory();

        displayCurrentFolder();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    };


    content.appendChild(folder);

}


/* =========================================================
   BACK
========================================================= */

function goBack(updateBrowserHistory = true) {

    if (currentPath.length === 0) {

        return;

    }


    currentPath.pop();

    currentNode = database;


    for (
        let i = 0;
        i < currentPath.length;
        i++
    ) {

        currentNode =
            currentNode[currentPath[i]];

    }


    if (updateBrowserHistory) {

        history.back();

    } else {

        displayCurrentFolder();

    }

}


/* =========================================================
   PHONE / BROWSER BACK BUTTON
========================================================= */

window.addEventListener(
    "popstate",
    function(event) {

        if (event.state &&
            Array.isArray(event.state.path)) {

            currentPath =
                event.state.path.slice();

        } else {

            currentPath = [];

        }


        currentNode = database;


        for (
            let i = 0;
            i < currentPath.length;
            i++
        ) {

            if (
                currentNode[
                    currentPath[i]
                ] !== undefined
            ) {

                currentNode =
                    currentNode[
                        currentPath[i]
                    ];

            } else {

                currentPath = [];

                currentNode = database;

                break;

            }

        }


        displayCurrentFolder();

    }
);


/* =========================================================
   GLOBAL SEARCH
========================================================= */

function searchDatabase(
    node,
    path,
    searchText,
    results
) {

    Object.keys(node).forEach(function(name) {

        const fullPath =
            path.concat(name);


        if (
            name
                .toLowerCase()
                .includes(searchText)
        ) {

            results.push({

                name: name,

                path: fullPath

            });

        }


        if (isObject(node[name])) {

            searchDatabase(
                node[name],
                fullPath,
                searchText,
                results
            );

        }

    });

}
