<style>

/* =========================================================
   GLOBAL
========================================================= */

* {

}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;

}


/* =========================================================
   HEADER
========================================================= */

header {

}

header p {

}


/* =========================================================
   SEARCH
========================================================= */

.search-area {
    background: white;
    padding: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 7px rgba(0,0,0,.10);
}

.search-box {
    width: 95%;
    max-width: 700px;

    margin: auto;
    padding: 14px 16px;

    border-radius: 10px;
    font-size: 16px;

}

.search-box:focus {
    border-color: #2563eb;
}


/* =========================================================
   MAIN
========================================================= */

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}


/* =========================================================
   TREE / BREADCRUMB
========================================================= */

.path {
    background: #dbeafe;
    border-left: 6px solid #2563eb;
    padding: 14px 15px;
    border-radius: 9px;
    margin-bottom: 14px;

    font-size: 15px;
    font-weight: 900;

    color: #1e3a8a;
    line-height: 1.7;

    word-break: break-word;

    box-shadow: 0 2px 5px rgba(0,0,0,.08);
}

.path-home {
    font-weight: 900;
    color: #1d4ed8;
    cursor: pointer;
}

.path-item {
    font-weight: 900;
    color: #1e40af;
    cursor: pointer;
}

.path-item:hover,
.path-home:hover {
    text-decoration: underline;
}

.path-arrow {
    font-weight: 900;
    color: #2563eb;
    padding: 0 5px;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-button {
    display: none;

    border: none;

    background: #2563eb;
    color: white;

    padding: 11px 18px;

    border-radius: 8px;

    font-size: 16px;
    font-weight: 800;

    margin-bottom: 12px;

    cursor: pointer;

    box-shadow: 0 3px 8px rgba(37,99,235,.20);
}

.back-button:hover {
    background: #1d4ed8;
}

.back-button:active {
    transform: scale(.97);
}


/* =========================================================
   FOLDER GRID
========================================================= */

.folder-grid {

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 15px;

    width: 100%;

}


/* =========================================================
   FOLDER BOX
========================================================= */

.folder {

    min-height: 125px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f1f5ff
        );

    padding: 20px 14px;

    border-radius: 16px;

    border: 2px solid #cbd5e1;

    box-shadow:
        0 5px 14px rgba(15,23,42,.10);

    cursor: grab;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;

    user-select: none;

    touch-action: none;

}


/* HOVER */

.folder:hover {

    border-color: #60a5fa;

    box-shadow:
        0 8px 20px rgba(37,99,235,.18);

    transform: translateY(-2px);

}


/* CLICK */

.folder:active {

    cursor: grabbing;

}


/* DRAGGING */

.folder.dragging {

    opacity: .45;

    transform:
        scale(.96);

}


/* DROP TARGET */

.folder.drag-over {

    border-color: #2563eb;

    box-shadow:
        0 0 0 4px rgba(37,99,235,.14);

}


/* =========================================================
   FOLDER TEXT
========================================================= */

.folder-title {

    line-height: 1.35;

    font-weight: 900;

    color: #1e40af;

    word-break: break-word;

/* =========================================================
   EMPTY FOLDER
========================================================= */

    border-radius: 14px;

    color: #64748b;

    font-weight: 700;

    border: 2px solid #e2e8f0;

}


/* =========================================================
   SEARCH RESULTS
========================================================= */

.result-path {

    margin-top: 8px;

    font-size: 13px;

    font-weight: 700;

    color: #475569;

    line-height: 1.5;

}


/* Search results do not use drag mode */

.search-result {

    cursor: pointer;

    min-height: auto;

}


/* =========================================================
   NO RESULTS
========================================================= */

.no-results {

    background: white;

    padding: 30px;

    text-align: center;

    border-radius: 12px;

    color: #64748b;

    font-weight: 700;

}


/* =========================================================
   FOOTER
========================================================= */

footer {

    padding: 30px 15px;

    color: #64748b;

    font-size: 14px;

    font-weight: 600;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .container {
        padding: 12px;
    }

    .folder-grid {

        grid-template-columns:
            repeat(3, minmax(0, 1fr));

/* =========================================================

};

const SoftwareData = {

            },

            "Inverter Front Load": {},
            "Non Inverter Top Load": {},
            "Non Inverter Front Load": {}

        }

    },

};


/* =========================================================
   MAIN DATABASE
========================================================= */

const database = {

    "Fridge":

    "Washing Machine":
        WashingMachine,

    "Microwave Oven":
        MicrowaveOven,

    "Induction Cooktop":

    "Chimney PCB":
        ChimneyPCB,

        PCBTestPoints,

    "PDF":
        {},

    "Photos":
        Photos,

    "Software Data":
        SoftwareData,

    "Videos":
        Videos

};


/* =========================================================
   APP STATE
========================================================= */

let currentNode = database;

let currentPath = [];


/* =========================================================
   ELEMENTS
========================================================= */

const content =
    document.getElementById("content");

const pathDisplay =
    document.getElementById("pathDisplay");

const backButton =
    document.getElementById("backButton");

const searchBox =
    document.getElementById("searchBox");


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "pcb_repair_box_positions_v1";


/* =========================================================
   LOAD SAVED POSITIONS
========================================================= */

function getSavedPositions() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!saved) {

            return {};

        }

        return JSON.parse(saved);

    }

    catch (error) {

        return {};

    }

}


/* =========================================================
   SAVE POSITIONS
========================================================= */

function savePositions(positions) {

    try {

        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify(positions)

        );

    }

    catch (error) {

        console.log(
            "Could not save box positions."
        );

    }

}


/* =========================================================
   CURRENT FOLDER STORAGE ID
========================================================= */

function getFolderStorageID() {

    if (
        currentPath.length === 0
    ) {

        return "HOME";

    }

    return currentPath.join("||");

}


/* =========================================================
   GET CURRENT ORDER
========================================================= */

function getSavedOrder() {

    const allPositions =
        getSavedPositions();

    const folderID =
        getFolderStorageID();

    return allPositions[folderID] || [];

}


/* =========================================================
   SAVE CURRENT ORDER
========================================================= */

function saveCurrentOrder(order) {

    const allPositions =
        getSavedPositions();

    const folderID =
        getFolderStorageID();

    allPositions[folderID] =
        order;

    savePositions(
        allPositions
    );

}


/* =========================================================
   APPLY SAVED ORDER
========================================================= */

function applySavedOrder(names) {

    const savedOrder =
        getSavedOrder();

    if (
        !Array.isArray(savedOrder) ||
        savedOrder.length === 0
    ) {

        return names;

    }

    const ordered = [];


    savedOrder.forEach(function(name) {

        if (
            names.includes(name)
        ) {

            ordered.push(name);

        }

    });


    names.forEach(function(name) {

        if (
            !ordered.includes(name)
        ) {

            ordered.push(name);

        }

    });


    return ordered;

}


/* =========================================================
   ENCODE PATH
========================================================= */

function encodePath(path) {

    return path
        .map(function(item) {

            return encodeURIComponent(item);

        })
        .join("/");

}


/* =========================================================
   DECODE PATH
========================================================= */

function decodePath() {

    const hash =
        window.location.hash;


    if (
        !hash ||
        hash === "#"
    ) {

        return [];

    }


    const raw =
        hash.substring(1);


    if (!raw) {

        return [];

    }


    return raw
        .split("/")
        .map(function(item) {

            return decodeURIComponent(item);

        });

}


/* =========================================================
   CHANGE URL
========================================================= */

function setURLPath(path) {

    const newHash =
        encodePath(path);


    if (
        window.location.hash.substring(1)
        === newHash
    ) {

        rebuildFromPath(path);

        showCurrentFolder();

        return;

    }


    window.location.hash =
        newHash;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================================================
   REBUILD NODE
========================================================= */

function rebuildFromPath(path) {

    currentNode =
        database;

    currentPath = [];


    for (
        let i = 0;
        i < path.length;
        i++
    ) {

        const name =
            path[i];


        if (
            !currentNode ||

            !Object.prototype.hasOwnProperty.call(
                currentNode,
                name
            )
        ) {

            currentNode =
                database;

            currentPath = [];

            return;

        }


        currentNode =
            currentNode[name];

        currentPath.push(name);

    }

}


/* =========================================================
   UPDATE BREADCRUMB
========================================================= */

function updatePath() {

    let html = "";


    if (
        currentPath.length === 0
    ) {

        html = `

            <span
                class="path-home"
                data-path="">

                HOME

            </span>

        `;

    }

    else {

        html = `

            <span
                class="path-home"
                data-path="">

                HOME

            </span>

        `;


        currentPath.forEach(
            function(name, index) {

                const path =
                    currentPath.slice(
                        0,
                        index + 1
                    );


                html += `

                    <span class="path-arrow">

                        →

                    </span>

                    <span
                        class="path-item"
                        data-path="${escapeHTML(
                            encodePath(path)
                        )}">

                        ${escapeHTML(name)}

                    </span>

                `;

            }
        );

    }


    pathDisplay.innerHTML =
        html;


    /* Home click */

    const home =
        pathDisplay.querySelector(
            ".path-home"
        );


    if (home) {

        home.addEventListener(
            "click",
            function() {

                setURLPath([]);

            }
        );

    }


    /* Individual tree items */

    const items =
        pathDisplay.querySelectorAll(
            ".path-item"
        );


    items.forEach(function(item) {

        item.addEventListener(
            "click",
            function() {

                const encoded =
                    item.dataset.path;


                const path =
                    encoded
                        .split("/")
                        .map(function(value) {

                            return decodeURIComponent(
                                value
                            );

                        });


                setURLPath(path);

            }
        );

    });

}


/* =========================================================
   UPDATE BACK BUTTON
========================================================= */

function updateBackButton() {

    if (
        currentPath.length === 0
    ) {

        backButton.style.display =
            "none";

    }

    else {

        backButton.style.display =
            "inline-block";

    }

}


/* =========================================================
   CREATE FOLDER BOX
========================================================= */

function createFolderBox(
    folderName
) {

    const folder =
        document.createElement("div");


    folder.className =
        "folder";


    folder.draggable =
        true;


    folder.dataset.folder =
        folderName;


    folder.innerHTML = `

        <div class="folder-title">

            ${escapeHTML(folderName)}

        </div>

    `;


    /* =====================================================
       CLICK
    ===================================================== */

    folder.addEventListener(
        "click",
        function() {

            /*
               Ignore click after dragging.
            */

            if (
                folder.dataset.wasDragged
                === "true"
            ) {

                folder.dataset.wasDragged =
                    "false";

                return;

            }


            openFolder(folderName);

        }
    );


    /* =====================================================
       DRAG START
    ===================================================== */

    folder.addEventListener(
        "dragstart",
        function(event) {

            folder.classList.add(
                "dragging"
            );


            folder.dataset.wasDragged =
                "false";


            event.dataTransfer.effectAllowed =
                "move";


            event.dataTransfer.setData(
                "text/plain",
                folderName
            );

        }
    );


    /* =====================================================
       DRAG END
    ===================================================== */

    folder.addEventListener(
        "dragend",
        function() {

            folder.classList.remove(
                "dragging"
            );

            saveGridOrder();

            setTimeout(function() {

                folder.dataset.wasDragged =
                    "true";

            }, 50);

        }
    );


    /* =====================================================
       DRAG OVER
    ===================================================== */

    folder.addEventListener(
        "dragover",
        function(event) {

            event.preventDefault();

            folder.classList.add(
                "drag-over"
            );

        }
    );


    /* =====================================================
       DRAG LEAVE
    ===================================================== */

    folder.addEventListener(
        "dragleave",
        function() {

            folder.classList.remove(
                "drag-over"
            );

        }
    );


    /* =====================================================
       DROP
    ===================================================== */

    folder.addEventListener(
        "drop",
        function(event) {

            event.preventDefault();


            folder.classList.remove(
                "drag-over"
            );


            const draggedName =
                event.dataTransfer.getData(
                    "text/plain"
                );


            if (
                !draggedName ||
                draggedName === folderName
            ) {

                return;

            }


            const grid =
                document.getElementById(
                    "folderGrid"
                );


            const dragged =
                Array.from(
                    grid.children
                ).find(function(item) {

                    return item.dataset.folder
                        === draggedName;

                });


            if (!dragged) {

                return;

            }


            const allItems =
                Array.from(
                    grid.children
                );


            const targetIndex =
                allItems.indexOf(folder);


            const draggedIndex =
                allItems.indexOf(dragged);


            if (
                draggedIndex <
                targetIndex
            ) {

                grid.insertBefore(
                    dragged,
                    folder.nextSibling
                );

            }

            else {

                grid.insertBefore(
                    dragged,
                    folder
                );

            }


            saveGridOrder();

        }
    );


    return folder;

}


/* =========================================================
   SAVE GRID ORDER
========================================================= */

function saveGridOrder() {

    const grid =
        document.getElementById(
            "folderGrid"
        );


    if (!grid) {

        return;

    }


    const order =
        Array.from(
            grid.children
        ).map(function(item) {

            return item.dataset.folder;

        });


    saveCurrentOrder(order);

}


/* =========================================================
   SHOW CURRENT FOLDER
========================================================= */

function showCurrentFolder() {

    content.innerHTML = "";


    updatePath();

    updateBackButton();


    const folderNames =
        Object.keys(currentNode);


    if (
        folderNames.length === 0
    ) {

        content.innerHTML = `

            <div class="file-placeholder">

                This folder is currently empty.

            </div>

        `;

        return;

    }


    const orderedNames =
        applySavedOrder(
            folderNames
        );


    const grid =
        document.createElement("div");


    grid.className =
        "folder-grid";


    grid.id =
        "folderGrid";


    orderedNames.forEach(
        function(folderName) {

            const folder =
                createFolderBox(
                    folderName
                );


            grid.appendChild(
                folder
            );

        }
    );


    content.appendChild(
        grid
    );

}


/* =========================================================
   OPEN FOLDER
========================================================= */

function openFolder(folderName) {

    const newPath =
        currentPath.concat(
            folderName
        );


    setURLPath(
        newPath
    );


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =========================================================
   APP BACK BUTTON
========================================================= */

backButton.addEventListener(
    "click",
    function() {

        if (
            currentPath.length === 0
        ) {

            return;

        }


        const parentPath =
            currentPath.slice(
                0,
                currentPath.length - 1
            );


        setURLPath(
            parentPath
        );


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }
);


/* =========================================================
   PHONE / BROWSER BACK
========================================================= */

window.addEventListener(
    "hashchange",
    function() {

        const path =
            decodePath();


        rebuildFromPath(
            path
        );


        searchBox.value =
            "";


        showCurrentFolder();


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }
);


/* =========================================================
   SEARCH TREE
========================================================= */

function searchTree(
    node,
    path,
    text,
    results
) {

    if (
        !node ||
        typeof node !== "object"
    ) {

        return;

    }


    Object.keys(node).forEach(
        function(name) {

            const newPath =
                path.concat(name);


            if (
                name
                    .toLowerCase()
                    .includes(text)
            ) {

                results.push({

                    name: name,

                    path: newPath

                });

            }


            if (
                node[name] &&
                typeof node[name] === "object"
            ) {

                searchTree(

                    node[name],

                    newPath,

                    text,

                    results

                );

            }

        }
    );

}


/* =========================================================
   SEARCH
========================================================= */

function performSearch(text) {

    text =
        text.trim().toLowerCase();


    if (!text) {

        showCurrentFolder();

        return;

    }


    const results = [];


    searchTree(

        database,

        [],

        text,

        results

    );


    content.innerHTML = "";


    pathDisplay.innerHTML = `

        <span class="path-item">

            SEARCH RESULTS

        </span>

    `;


    if (
        results.length === 0
    ) {

        content.innerHTML = `

            <div class="no-results">

                No matching folder found.

            </div>

        `;

        return;

    }


    const grid =
        document.createElement("div");


    grid.className =
        "folder-grid";


    results.forEach(
        function(result) {

            const item =
                document.createElement("div");


            item.className =
                "folder search-result";


            item.innerHTML = `

                <div>

                    <div class="folder-title">

                        ${escapeHTML(
                            result.name
                        )}

                    </div>

                    <div class="result-path">

                        ${escapeHTML(
                            result.path.join(
                                " → "
                            )
                        )}

                    </div>

                </div>

            `;


            item.addEventListener(
                "click",
                function() {

                    setURLPath(
                        result.path
                    );


                    searchBox.value =
                        "";

                }
            );


            grid.appendChild(
                item
            );

        }
    );


    content.appendChild(
        grid
    );

}


/* =========================================================
   SEARCH EVENT
========================================================= */

searchBox.addEventListener(
    "input",
    function() {

        performSearch(
            this.value
        );

    }
);


/* =========================================================
   START APPLICATION
========================================================= */

const initialPath =
    decodePath();


rebuildFromPath(
    initialPath
);


showCurrentFolder();

</script>

</body>

</html>
