<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My PCB Repair Data</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    color: #222;
}

header {
    background: #1f2937;
    color: white;
    padding: 22px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 8px 0 0;
}

.search-area {
    background: white;
    padding: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
}

.search-box {
    width: 95%;
    max-width: 650px;
    display: block;
    margin: auto;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

.path {
    background: white;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 14px;
    color: #555;
    word-break: break-word;
}

.back-button {
    display: none;
    border: none;
    background: #2563eb;
    color: white;
    padding: 11px 16px;
    border-radius: 7px;
    font-size: 15px;
    margin-bottom: 12px;
}

.folder {
    background: white;
    margin: 10px 0;
    padding: 18px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.09);
    cursor: pointer;
}

.folder:active {
    transform: scale(.99);
}

.folder-title {
    font-size: 18px;
    font-weight: bold;
}

.folder-path {
    margin-top: 6px;
    color: #777;
    font-size: 13px;
}

.file-placeholder {
    background: white;
    padding: 25px;
    text-align: center;
    border-radius: 10px;
    color: #777;
}

.search-results {
    margin-top: 15px;
}

.result {
    background: white;
    padding: 16px;
    margin: 10px 0;
    border-radius: 9px;
    box-shadow: 0 2px 5px rgba(0,0,0,.08);
    cursor: pointer;
}

.result-title {
    font-weight: bold;
    font-size: 16px;
}

.result-path {
    margin-top: 6px;
    font-size: 13px;
    color: #666;
}

.no-results {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
    color: #777;
}

footer {
    text-align: center;
    padding: 30px 15px;
    color: #777;
    font-size: 14px;
}

</style>

</head>


<body>


<header>

<h1>🔧 My PCB Repair Data</h1>

<p>
Personal PCB Repair Database
</p>

</header>


<div class="search-area">

<input
    id="searchBox"
    class="search-box"
    type="search"
    placeholder="Search anywhere: IC, error code, brand, model..."
    autocomplete="off">

</div>


<div class="container">


<button
    id="backButton"
    class="back-button"
    onclick="goBack()">

← Back

</button>


<div
    id="pathDisplay"
    class="path">

📁 Home

</div>


<div id="content"></div>


</div>


<footer>

My Personal PCB Repair Database

</footer>



<script>


/* =========================================================
   MASTER BRAND LIST
   Used by Error Codes, Photos and Videos
========================================================= */

const brands = [

    "LG",
    "Samsung",
    "Whirlpool",
    "Godrej",
    "Blue Star",
    "IFB",
    "Voltas",
    "Hitachi",
    "Haier",
    "Daikin",
    "Panasonic",
    "Videocon",
    "Mitsubishi HD",
    "Mitsubishi Electric",
    "O General",
    "Lloyd",
    "Sharp",
    "Toshiba",
    "Carrier",
    "Reconnect / Amstard / Amazon Basics"

];



/* =========================================================
   BRAND FOLDER CREATOR
========================================================= */

function brandFolders() {

    return brands.map(function(brand) {

        return {
            name: brand,
            type: "folder",
            children: {}
        };

    });

}



/* =========================================================
   PHOTOS
========================================================= */

const photos = {

    "AC": brandFolders(),

    "Fridge": brandFolders(),

    "Washing Machine": brandFolders(),

    "Microwave Oven": [],

    "Induction": [],

    "RO": [],

    "Chimney": [],

    "Misc": []

};



/* =========================================================
   VIDEOS
========================================================= */

const videos = {

    "AC": brandFolders(),

    "Fridge": brandFolders(),

    "Washing Machine": brandFolders(),

    "Microwave Oven": [],

    "Induction": [],

    "RO": [],

    "Chimney": [],

    "Misc": []

};



/* =========================================================
   ERROR CODES
========================================================= */

const errorCodes = {};

brands.forEach(function(brand) {

    errorCodes[brand] = [];

});



/* =========================================================
   SOFTWARE DATA
========================================================= */

const softwareData = {

    "EEPROM Data": {

        "AC": {

            "Inverter Indoor PCB": [],

            "Non Inverter Indoor PCB": [],

            "Inverter ODU PCB": [],

            "Non Inverter ODU PCB": []

        },


        "Fridge": {

            "Single Door": {

                "Inverter": [],

                "Non Inverter": []

            },

            "Double Door": {

                "Inverter": [],

                "Non Inverter": []

            },

            "Triple Door": {

                "Inverter": [],

                "Non Inverter": []

            },

            "Side by Side": {

                "Inverter": [],

                "Non Inverter": []

            },

            "Fridge Signal Card": [],

            "Fridge Inverter Card": []

        },


        "Washing Machine": {

            "Inverter Top Load": [],

            "Non Inverter Top Load": [],

            "Inverter Front Load": [],

            "Non Inverter Front Load": []

        }

    },


    "MCU Data": {}

};



/* =========================================================
   COMPLETE MAIN FOLDER STRUCTURE
========================================================= */

const database = {

    "AC": {},

    "Circuit Diagrams": {},

    "Electronic Components": {},

    "Error Codes": errorCodes,

    "Fridge": {

        "Circuit Diagrams": {},

        "EEPROM BIN Files": {},

        "Error Codes": {},

        "Inverter PCB": {},

        "Photos": {},

        "Sensor Details": {},

        "Signal PCB": {},

        "Videos": {},

        "Wiring Details": {}

    },


    "Microwave Oven": {

        "MW Oven Touch": {},

        "MW Oven Wiring": {}

    },


    "PCB Test Points": {},

    "PDF": {},

    "Photos": photos,

    "Software Data": softwareData,

    "Videos": videos,

    "Washing Machine": {},

    "Induction Cooktop": {},

    "Chimney PCB": {},

    "R O PCB": {}

};



/* =========================================================
   CURRENT LOCATION
========================================================= */

let currentNode = database;

let currentPath = [];



/* =========================================================
   ELEMENTS
========================================================= */

const content =
    document.getElementById("content");

const backButton =
    document.getElementById("backButton");

const pathDisplay =
    document.getElementById("pathDisplay");

const searchBox =
    document.getElementById("searchBox");



/* =========================================================
   CHECK WHETHER SOMETHING IS A FOLDER
========================================================= */

function isObject(value) {

    return value !== null &&
           typeof value === "object";

}



/* =========================================================
   DISPLAY CURRENT FOLDER
========================================================= */

function displayCurrentFolder() {

    content.innerHTML = "";

    pathDisplay.innerHTML =
        "📁 " +
        (currentPath.length
        ? currentPath.join(" → ")
        : "Home");


    if (currentPath.length === 0) {

        backButton.style.display = "none";

    } else {

        backButton.style.display = "inline-block";

    }


    const keys = Object.keys(currentNode);


    if (keys.length === 0) {

        content.innerHTML = `

        <div class="file-placeholder">

        📂 This folder is currently empty.

        <br><br>

        Files will appear here after we connect
        your Appwrite storage.

        </div>

        `;

        return;

    }


    keys.forEach(function(name) {

        createFolderElement(
            name,
            currentNode[name]
        );

    });

}



/* =========================================================
   CREATE FOLDER
========================================================= */

function createFolderElement(name, node) {

    const folder =
        document.createElement("div");

    folder.className = "folder";


    folder.innerHTML = `

        <div class="folder-title">

            📁 ${escapeHTML(name)}

        </div>

        <div class="folder-path">

            Tap to open

        </div>

    `;


    folder.onclick = function() {

        currentNode = node;

        currentPath.push(name);

        displayCurrentFolder();

    };


    content.appendChild(folder);

}



/* =========================================================
   BACK
========================================================= */

function goBack() {

    if (currentPath.length === 0) {

        return;

    }


    currentPath.pop();


    currentNode = database;


    for (let i = 0;
         i < currentPath.length;
         i++) {

        currentNode =
            currentNode[currentPath[i]];

    }


    displayCurrentFolder();

}



/* =========================================================
   GLOBAL SEARCH
========================================================= */

function searchDatabase(
    node,
    path,
    searchText,
    results
) {

    Object.keys(node).forEach(function(name) {

        const fullPath =
            path.concat(name);

        const nameMatch =
            name.toLowerCase()
            .includes(searchText);


        if (nameMatch) {

            results.push({

                name: name,

                path: fullPath

            });

        }


        if (isObject(node[name])) {

            searchDatabase(
                node[name],
                fullPath,
                searchText,
                results
            );

        }

    });

}



/* =========================================================
   DISPLAY SEARCH RESULTS
========================================================= */

function performSearch(text) {

    text =
        text.trim().toLowerCase();


    if (!text) {

        displayCurrentFolder();

        return;

    }


    const results = [];


    searchDatabase(
        database,
        [],
        text,
        results
    );


    content.innerHTML = "";

    pathDisplay.innerHTML =
        "🔎 Search Results";


    backButton.style.display =
        "inline-block";


    if (results.length === 0) {

        content.innerHTML = `

        <div class="no-results">

            No matching folder found.

            <br><br>

            Your actual files will also become
            searchable when Appwrite storage is connected.

        </div>

        `;

        return;

    }


    const heading =
        document.createElement("div");

    heading.style.marginBottom = "10px";

    heading.innerHTML =
        "<b>" +
        results.length +
        "</b> result(s) found";


    content.appendChild(heading);


    results.forEach(function(result) {

        const div =
            document.createElement("div");

        div.className = "result";


        div.innerHTML = `

            <div class="result-title">

                📁 ${escapeHTML(result.name)}

            </div>

            <div class="result-path">

                ${escapeHTML(
                    result.path.join(" → ")
                )}

            </div>

        `;


        div.onclick = function() {

            openSearchResult(result.path);

        };


        content.appendChild(div);

    });

}



/* =========================================================
   OPEN SEARCH RESULT
========================================================= */

function openSearchResult(path) {

    currentNode = database;

    currentPath = [];


    for (let i = 0;
         i < path.length;
         i++) {

        currentNode =
            currentNode[path[i]];

        currentPath.push(path[i]);

    }


    searchBox.value = "";

    displayCurrentFolder();

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =========================================================
   SEARCH EVENT
========================================================= */

searchBox.addEventListener(
    "input",
    function() {

        performSearch(this.value);

    }
);



/* =========================================================
   START WEBSITE
========================================================= */

displayCurrentFolder();


</script>

</body>

</html>
