<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PCB REPAIR DATA</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
    color: #1f2937;
}

/* =========================
   HEADER
========================= */

header {
    background: #1f2937;
    color: white;
    padding: 22px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 800;
}

header p {
    margin: 8px 0 0;
    font-size: 16px;
    font-weight: 700;
}

/* =========================
   SEARCH
========================= */

.search-area {
    background: white;
    padding: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 7px rgba(0,0,0,.10);
}

.search-box {
    width: 95%;
    max-width: 700px;
    display: block;
    margin: auto;
    padding: 14px 16px;
    border: 2px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

.search-box:focus {
    border-color: #2563eb;
}

/* =========================
   MAIN CONTAINER
========================= */

.container {
    max-width: 950px;
    margin: auto;
    padding: 15px;
}

/* =========================
   BREADCRUMB
========================= */

.path {
    background: #dbeafe;
    border-left: 5px solid #2563eb;
    padding: 14px 15px;
    border-radius: 9px;
    margin-bottom: 14px;
    font-size: 15px;
    font-weight: 800;
    color: #1e3a8a;
    line-height: 1.5;
    word-break: break-word;
    box-shadow: 0 2px 5px rgba(0,0,0,.08);
}

/* =========================
   BACK BUTTON
========================= */

.back-button {
    display: none;
    border: none;
    background: #2563eb;
    color: white;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    cursor: pointer;
}

.back-button:active {
    transform: scale(.97);
}

/* =========================
   FOLDER CARDS
========================= */

.folder {
    background: white;
    margin: 11px 0;
    padding: 19px 18px;
    border-radius: 11px;
    border: 2px solid #dbe3ee;
    box-shadow: 0 3px 8px rgba(0,0,0,.08);
    cursor: pointer;
    transition: .15s ease;
}

.folder:hover {
    border-color: #93c5fd;
    box-shadow: 0 4px 12px rgba(37,99,235,.14);
}

.folder:active {
    transform: scale(.985);
}

.folder-title {
    font-size: 18px;
    font-weight: 800;
    color: #111827;
}

/* =========================
   EMPTY FOLDER
========================= */

.file-placeholder {
    background: white;
    padding: 30px 20px;
    text-align: center;
    border-radius: 11px;
    color: #6b7280;
    font-weight: 600;
}

/* =========================
   SEARCH RESULTS
========================= */

.result {
    background: white;
    padding: 17px;
    margin: 10px 0;
    border-radius: 10px;
    border: 2px solid #e5e7eb;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    cursor: pointer;
}

.result-title {
    font-weight: 800;
    font-size: 17px;
}

.result-path {
    margin-top: 7px;
    font-size: 13px;
    font-weight: 600;
    color: #4b5563;
    line-height: 1.5;
}

.no-results {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
    color: #777;
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;
    padding: 30px 15px;
    color: #6b7280;
    font-size: 14px;
    font-weight: 600;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    header h1 {
        font-size: 25px;
    }

    header p {
        font-size: 14px;
    }

    .container {
        padding: 12px;
    }

    .folder {
        padding: 18px 15px;
    }

    .folder-title {
        font-size: 17px;
    }

    .path {
        font-size: 14px;
    }

}

</style>

</head>


<body>


<header>

    <h1>PCB REPAIR DATA</h1>

    <p>PCB REPAIR DATABASE</p>

</header>


<div class="search-area">

    <input
        id="searchBox"
        class="search-box"
        type="search"
        placeholder="Search IC, error code, brand, model..."
        autocomplete="off">

</div>


<div class="container">

    <button
        id="backButton"
        class="back-button"
        type="button">

        ← Back

    </button>


    <div
        id="pathDisplay"
        class="path">

        📁 Home

    </div>


    <div id="content"></div>

</div>


<footer>

    PCB REPAIR DATABASE

</footer>


<script>

/* =========================================================
   FOLDER CREATOR
========================================================= */

function makeFolders(names) {

    const result = {};

    names.forEach(function(name) {

        result[name] = {};

    });

    return result;

}


/* =========================================================
   AC CATEGORIES
========================================================= */

const acTypes = [

    "Inverter Window",
    "Inverter Split",
    "Inverter Cassette",
    "Inverter Ductable",
    "Non Inverter Window",
    "Non Inverter Split",
    "Non Inverter Cassette",
    "Non Inverter Ductable"

];


/* =========================================================
   FRIDGE CATEGORIES
========================================================= */

const fridgeTypes = [

    "Inverter Single Door",
    "Inverter Double Door",
    "Inverter Triple Door",
    "Inverter Side by Side",
    "Non Inverter Single Door",
    "Non Inverter Double Door",
    "Non Inverter Triple Door",
    "Non Inverter Side by Side"

];


/* =========================================================
   WASHING MACHINE CATEGORIES
========================================================= */

const washingMachineTypes = [

    "Inverter Top Load",
    "Inverter Front Load",
    "Non Inverter Top Load",
    "Non Inverter Front Load"

];


/* =========================================================
   MICROWAVE CATEGORIES
========================================================= */

const microwaveTypes = [

    "Inverter",
    "Non Inverter"

];


/* =========================================================
   AC
========================================================= */

const AC = {

    "Circuit Diagrams":
        makeFolders(acTypes),

    "EEPROM BIN Files":
        makeFolders(acTypes),

    "Error Codes":
        makeFolders(acTypes),

    "Inverter AC": {

        "Window": {},
        "Split": {},
        "Cassette": {},
        "Ductable": {}

    },

    "Non Inverter AC": {

        "Window": {},
        "Split": {},
        "Cassette": {},
        "Ductable": {}

    },

    "PDF":
        makeFolders(acTypes),

    "Photos":
        makeFolders(acTypes),

    "Remote Photos":
        makeFolders(acTypes),

    "Sensor Details":
        makeFolders(acTypes),

    "Test Points":
        makeFolders(acTypes)

};


/* =========================================================
   FRIDGE
========================================================= */

const Fridge = {

    "Circuit Diagrams":
        makeFolders(fridgeTypes),

    "EEPROM BIN Files":
        makeFolders(fridgeTypes),

    "Error Codes":
        makeFolders(fridgeTypes),

    "Inverter PCB": {

        "Inverter Single Door": {},
        "Inverter Double Door": {},
        "Inverter Triple Door": {},
        "Inverter Side by Side": {}

    },

    "Photos":
        makeFolders(fridgeTypes),

    "Sensor Details":
        makeFolders(fridgeTypes),

    "Signal PCB":
        makeFolders(fridgeTypes),

    "Videos":
        makeFolders(fridgeTypes),

    "Wiring Details":
        makeFolders(fridgeTypes)

};


/* =========================================================
   WASHING MACHINE

   IMPORTANT:
   Remote Photos is intentionally NOT included.
========================================================= */

const WashingMachine = {

    "Circuit Diagrams":
        makeFolders(washingMachineTypes),

    "EEPROM BIN Files":
        makeFolders(washingMachineTypes),

    "Error Codes":
        makeFolders(washingMachineTypes),

    "Photos":
        makeFolders(washingMachineTypes),

    "Test Points":
        makeFolders(washingMachineTypes),

    "Videos":
        makeFolders(washingMachineTypes),

    "Wiring Details":
        makeFolders(washingMachineTypes)

};


/* =========================================================
   MICROWAVE OVEN
========================================================= */

const MicrowaveOven = {

    "MW Oven Touch":
        makeFolders(microwaveTypes),

    "MW Oven Wiring":
        makeFolders(microwaveTypes)

};


/* =========================================================
   INDUCTION COOKTOP
========================================================= */

const InductionCooktop = {

    "Circuit Diagrams": {},

    "Error Codes": {},

    "Photos": {},

    "Videos": {},

    "Test Points": {},

    "Wiring Details": {},

    "PDF": {}

};


/* =========================================================
   CHIMNEY PCB
========================================================= */

const ChimneyPCB = {

    "Circuit Diagrams": {},

    "Error Codes": {},

    "Photos": {},

    "Videos": {},

    "Test Points": {},

    "Wiring Details": {},

    "PDF": {}

};


/* =========================================================
   R O PCB
========================================================= */

const ROPCB = {

    "Circuit Diagrams": {},

    "Error Codes": {},

    "EEPROM BIN Files": {},

    "Photos": {},

    "Videos": {},

    "Test Points": {},

    "Wiring Details": {},

    "Sensor Details": {},

    "PDF": {}

};


/* =========================================================
   CIRCUIT DIAGRAMS MAIN FOLDER
========================================================= */

const CircuitDiagrams = {

    "AC":
        makeFolders(acTypes),

    "Fridge":
        makeFolders(fridgeTypes),

    "Washing Machine":
        makeFolders(washingMachineTypes),

    "Microwave Oven":
        makeFolders(microwaveTypes),

    "Induction Cooktop": {},

    "Chimney PCB": {},

    "R O PCB": {}

};


/* =========================================================
   PCB TEST POINTS
========================================================= */

const PCBTestPoints = {

    "AC":
        makeFolders(acTypes),

    "Fridge":
        makeFolders(fridgeTypes),

    "Washing Machine":
        makeFolders(washingMachineTypes)

};


/* =========================================================
   PHOTOS
========================================================= */

const Photos = {

    "AC":
        makeFolders(acTypes),

    "Fridge":
        makeFolders(fridgeTypes),

    "Washing Machine":
        makeFolders(washingMachineTypes),

    "Microwave Oven": {},

    "Induction Cooktop": {},

    "Chimney PCB": {},

    "R O PCB": {},

    "Misc": {}

};


/* =========================================================
   VIDEOS
========================================================= */

const Videos = {

    "AC":
        makeFolders(acTypes),

    "Fridge":
        makeFolders(fridgeTypes),

    "Washing Machine":
        makeFolders(washingMachineTypes),

    "Microwave Oven": {},

    "Induction Cooktop": {},

    "Chimney PCB": {},

    "R O PCB": {},

    "Misc": {}

};


/* =========================================================
   SOFTWARE DATA
========================================================= */

const SoftwareData = {

    "EEPROM Data": {

        "AC": {

            "Inverter Indoor PCB": {},
            "Non Inverter Indoor PCB": {},
            "Inverter ODU PCB": {},
            "Non Inverter ODU PCB": {}

        },

        "Fridge": {

            "Single Door": {

                "Inverter": {},
                "Non Inverter": {}

            },

            "Double Door": {

                "Inverter": {},
                "Non Inverter": {}

            },

            "Triple Door": {

                "Inverter": {},
                "Non Inverter": {}

            },

            "Side by Side": {

                "Inverter": {},
                "Non Inverter": {}

            },

            "Fridge Signal Card": {},

            "Fridge Inverter Card": {}

        },

        "Washing Machine": {

            "Inverter Top Load": {},
            "Inverter Front Load": {},
            "Non Inverter Top Load": {},
            "Non Inverter Front Load": {}

        }

    },

    "MCU Data": {}

};


/* =========================================================
   MAIN DATABASE

   EXACT ORDER
========================================================= */

const database = {

    "AC":
        AC,

    "Fridge":
        Fridge,

    "Washing Machine":
        WashingMachine,

    "Microwave Oven":
        MicrowaveOven,

    "Induction Cooktop":
        InductionCooktop,

    "Chimney PCB":
        ChimneyPCB,

    "R O PCB":
        ROPCB,

    "Circuit Diagrams":
        CircuitDiagrams,

    "Electronic Components":
        {},

    "Error Codes":
        {},

    "PCB Test Points":
        PCBTestPoints,

    "PDF":
        {},

    "Photos":
        Photos,

    "Software Data":
        SoftwareData,

    "Videos":
        Videos

};


/* =========================================================
   APP STATE
========================================================= */

let currentNode = database;

let currentPath = [];


/* =========================================================
   ELEMENTS
========================================================= */

const content =
    document.getElementById("content");

const pathDisplay =
    document.getElementById("pathDisplay");

const backButton =
    document.getElementById("backButton");

const searchBox =
    document.getElementById("searchBox");


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   SHOW CURRENT FOLDER
========================================================= */

function showCurrentFolder() {

    content.innerHTML = "";


    /* Breadcrumb */

    if (currentPath.length === 0) {

        pathDisplay.textContent =
            "📁 Home";

        backButton.style.display =
            "none";

    } else {

        pathDisplay.textContent =
            "📁 " +
            currentPath.join(" → ");

        backButton.style.display =
            "inline-block";

    }


    /* Get current folders */

    const folderNames =
        Object.keys(currentNode);


    /* Empty folder */

    if (folderNames.length === 0) {

        content.innerHTML = `

            <div class="file-placeholder">

                📂 This folder is currently empty.

            </div>

        `;

        return;

    }


    /* IMPORTANT:
       Display every folder */

    folderNames.forEach(function(folderName) {

        const folder =
            document.createElement("div");

        folder.className =
            "folder";


        folder.innerHTML = `

            <div class="folder-title">

                📁 ${escapeHTML(folderName)}

            </div>

        `;


        folder.addEventListener(
            "click",
            function() {

                currentNode =
                    currentNode[folderName];

                currentPath.push(
                    folderName
                );

                showCurrentFolder();

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            }
        );


        content.appendChild(folder);

    });

}


/* =========================================================
   APP BACK
========================================================= */

function goBack() {

    if (currentPath.length === 0) {

        return;

    }


    currentPath.pop();


    currentNode = database;


    currentPath.forEach(function(name) {

        currentNode =
            currentNode[name];

    });


    showCurrentFolder();

}


/* =========================================================
   PHONE / BROWSER BACK BUTTON
========================================================= */

window.addEventListener(
    "popstate",
    function() {

        if (currentPath.length === 0) {

            showCurrentFolder();

            return;

        }

        currentPath.pop();

        currentNode = database;


        currentPath.forEach(function(name) {

            currentNode =
                currentNode[name];

        });


        showCurrentFolder();

    }
);


/* =========================================================
   SEARCH
========================================================= */

function searchTree(
    node,
    path,
    text,
    results
) {

    Object.keys(node).forEach(
        function(name) {

            const newPath =
                path.concat(name);


            if (
                name
                    .toLowerCase()
                    .includes(text)
            ) {

                results.push({

                    name: name,

                    path: newPath

                });

            }


            if (
                node[name] &&
                typeof node[name] === "object"
            ) {

                searchTree(
                    node[name],
                    newPath,
                    text,
                    results
                );

            }

        }
    );

}


/* =========================================================
   PERFORM SEARCH
========================================================= */

function performSearch(text) {

    text =
        text.trim().toLowerCase();


    if (!text) {

        showCurrentFolder();

        return;

    }


    const results = [];


    searchTree(
        database,
        [],
        text,
        results
    );


    content.innerHTML = "";


    pathDisplay.textContent =
        "🔎 Search Results";


    backButton.style.display =
        "inline-block";


    if (results.length === 0) {

        content.innerHTML = `

            <div class="no-results">

                No matching folder found.

            </div>

        `;

        return;

    }


    const heading =
        document.createElement("div");

    heading.style.fontWeight =
        "800";

    heading.style.marginBottom =
        "10px";

    heading.textContent =
        results.length +
        " result(s) found";


    content.appendChild(heading);


    results.forEach(
        function(result) {

            const item =
                document.createElement("div");

            item.className =
                "result";


            item.innerHTML = `

                <div class="result-title">

                    📁 ${escapeHTML(
                        result.name
                    )}

                </div>

                <div class="result-path">

                    ${escapeHTML(
                        result.path.join(" → ")
                    )}

                </div>

            `;


            item.addEventListener(
                "click",
                function() {

                    openPath(
                        result.path
                    );

                }
            );


            content.appendChild(item);

        }
    );

}


/* =========================================================
   OPEN SEARCH RESULT
========================================================= */

function openPath(path) {

    currentNode = database;

    currentPath = [];


    path.forEach(function(name) {

        currentNode =
            currentNode[name];

        currentPath.push(name);

    });


    searchBox.value = "";

    showCurrentFolder();

}


/* =========================================================
   SEARCH EVENT
========================================================= */

searchBox.addEventListener(
    "input",
    function() {

        performSearch(
            this.value
        );

    }
);


/* =========================================================
   START APP
========================================================= */

showCurrentFolder();

</script>

</body>

</html>
