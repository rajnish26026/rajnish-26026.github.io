================================ */

================================ */

================================ */

       Clearly visible professional

    align-items: center;

    justify-content: center;

        box-shadow .18s ease,
        background .18s ease,
        border-color .18s ease;

    touch-action: none;

/* ================================

================================ */

        0 8px 19px rgba(30,64,175,.17);

================================ */

/* =========================================================

const database = {

        Photos,

    "Software Data":
        SoftwareData,

    "Videos":
        Videos

};


/* =========================================================
   APP STATE
========================================================= */

let currentNode = database;

let currentPath = [];


/* =========================================================
   ELEMENTS
========================================================= */

const content =
    document.getElementById("content");

const pathDisplay =
    document.getElementById("pathDisplay");

const backButton =
    document.getElementById("backButton");

const searchBox =
    document.getElementById("searchBox");


/* =========================================================
   SAVED BOX ORDER
========================================================= */

const STORAGE_KEY =
    "pcb_repair_saved_box_order_v1";


function getSavedData() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!saved) {
            return {};
        }

        return JSON.parse(saved);

    } catch (error) {

        return {};

    }

}


function saveSavedData(data) {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );

    } catch (error) {

        console.log(
            "Could not save box arrangement."
        );

    }

}


function getCurrentFolderKey() {

    if (currentPath.length === 0) {

        return "HOME";

    }

    return currentPath.join(" / ");

}


function getSavedOrder() {

    const data =
        getSavedData();

    return data[
        getCurrentFolderKey()
    ] || [];

}


function saveCurrentOrder(order) {

    const data =
        getSavedData();

    data[
        getCurrentFolderKey()
    ] = order;

    saveSavedData(data);

}


function applySavedOrder(names) {

    const saved =
        getSavedOrder();

    if (
        !Array.isArray(saved) ||
        saved.length === 0
    ) {

        return names;

    }


    const result = [];


    saved.forEach(function(name) {

        if (
            names.includes(name)
        ) {

            result.push(name);

        }

    });


    names.forEach(function(name) {

        if (
            !result.includes(name)
        ) {

            result.push(name);

        }

    });


    return result;

}


/* =========================================================
   URL
========================================================= */

function encodePath(path) {

    return path
        .map(function(item) {

            return encodeURIComponent(item);

        })
        .join("/");

}


function decodePath() {

    const hash =
        window.location.hash;

    if (
        !hash ||
        hash === "#"
    ) {

        return [];

    }


    const raw =
        hash.substring(1);

    if (!raw) {

        return [];

    }


    return raw
        .split("/")
        .map(function(item) {

            return decodeURIComponent(item);

        });

}


function setURLPath(path) {

    const newHash =
        encodePath(path);

    const oldHash =
        window.location.hash.substring(1);


    if (oldHash === newHash) {

        rebuildFromPath(path);

        showCurrentFolder();

        return;

    }


    window.location.hash =
        newHash;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================================================
   REBUILD NODE
========================================================= */

function rebuildFromPath(path) {

    currentNode =
        database;

    currentPath = [];


    for (
        let i = 0;
        i < path.length;
        i++
    ) {

        const name =
            path[i];


        if (
            !currentNode ||
            !Object.prototype.hasOwnProperty.call(
                currentNode,
                name
            )
        ) {

            currentNode =
                database;

            currentPath = [];

            return;

        }


        currentNode =
            currentNode[name];

        currentPath.push(name);

    }

}


/* =========================================================
   TREE
========================================================= */

function updatePath() {

    let html = `

        <span
            class="path-home"
            data-index="-1">

            HOME

        </span>

    `;


    currentPath.forEach(
        function(name, index) {

            html += `

                <span class="path-arrow">
                    →
                </span>

                <span
                    class="path-item"
                    data-index="${index}">

                    ${escapeHTML(name)}

                </span>

            `;

        }
    );


    pathDisplay.innerHTML =
        html;


    const home =
        pathDisplay.querySelector(
            ".path-home"
        );


    if (home) {

        home.addEventListener(
            "click",
            function() {

                setURLPath([]);

            }
        );

    }


    const items =
        pathDisplay.querySelectorAll(
            ".path-item"
        );


    items.forEach(function(item) {

        item.addEventListener(
            "click",
            function() {

                const index =
                    Number(
                        item.dataset.index
                    );


                setURLPath(
                    currentPath.slice(
                        0,
                        index + 1
                    )
                );

            }
        );

    });

}


/* =========================================================
   BACK BUTTON
========================================================= */

function updateBackButton() {

    if (
        currentPath.length === 0
    ) {

        backButton.style.display =
            "none";

    } else {

        backButton.style.display =
            "inline-block";

    }

}


/* =========================================================
   SAVE GRID ORDER
========================================================= */

function saveGridOrder() {

    const grid =
        document.getElementById(
            "folderGrid"
        );


    if (!grid) {

        return;

    }


    const order =
        Array.from(
            grid.children
        ).map(function(item) {

            return item.dataset.folder;

        });


    saveCurrentOrder(order);

}


/* =========================================================
   CREATE FOLDER BOX
========================================================= */

function createFolderBox(
    folderName
) {

    const folder =
        document.createElement("div");


    folder.className =
        "folder";


    folder.dataset.folder =
        folderName;


    folder.draggable =
        true;


    folder.innerHTML = `

        <div class="folder-title">

            ${escapeHTML(folderName)}

        </div>

    `;


    /* CLICK */

    folder.addEventListener(
        "click",
        function() {

            if (
                folder.dataset.justDragged
                === "true"
            ) {

                folder.dataset.justDragged =
                    "false";

                return;

            }


            openFolder(
                folderName
            );

        }
    );


    /* DRAG START */

    folder.addEventListener(
        "dragstart",
        function(event) {

            folder.classList.add(
                "dragging"
            );

            folder.dataset.justDragged =
                "false";

            event.dataTransfer.effectAllowed =
                "move";

            event.dataTransfer.setData(
                "text/plain",
                folderName
            );

        }
    );


    /* DRAG END */

    folder.addEventListener(
        "dragend",
        function() {

            folder.classList.remove(
                "dragging"
            );

            saveGridOrder();

            folder.dataset.justDragged =
                "true";

        }
    );


    /* DRAG OVER */

    folder.addEventListener(
        "dragover",
        function(event) {

            event.preventDefault();

            folder.classList.add(
                "drag-over"
            );

        }
    );


    /* DRAG LEAVE */

    folder.addEventListener(
        "dragleave",
        function() {

            folder.classList.remove(
                "drag-over"
            );

        }
    );


    /* DROP */

    folder.addEventListener(
        "drop",
        function(event) {

            event.preventDefault();

            folder.classList.remove(
                "drag-over"
            );


            const draggedName =
                event.dataTransfer.getData(
                    "text/plain"
                );


            if (
                !draggedName ||
                draggedName === folderName
            ) {

                return;

            }


            const grid =
                document.getElementById(
                    "folderGrid"
                );


            if (!grid) {

                return;

            }


            const dragged =
                Array.from(
                    grid.children
                ).find(function(item) {

                    return (
                        item.dataset.folder
                        === draggedName
                    );

                });


            if (!dragged) {

                return;

            }


            const boxes =
                Array.from(
                    grid.children
                );


            const targetIndex =
                boxes.indexOf(folder);

            const draggedIndex =
                boxes.indexOf(dragged);


            if (
                draggedIndex <
                targetIndex
            ) {

                grid.insertBefore(
                    dragged,
                    folder.nextSibling
                );

            } else {

                grid.insertBefore(
                    dragged,
                    folder
                );

            }


            saveGridOrder();

        }
    );


    return folder;

}


/* =========================================================
   SHOW CURRENT FOLDER
========================================================= */

function showCurrentFolder() {

    content.innerHTML = "";

    updatePath();

    updateBackButton();


    const folderNames =
        Object.keys(
            currentNode
        );


    if (
        folderNames.length === 0
    ) {

        content.innerHTML = `

            <div class="file-placeholder">

                This folder is currently empty.

            </div>

        `;

        return;

    }


    const orderedNames =
        applySavedOrder(
            folderNames
        );


    const grid =
        document.createElement("div");


    grid.className =
        "folder-grid";

    grid.id =
        "folderGrid";


    orderedNames.forEach(
        function(folderName) {

            grid.appendChild(
                createFolderBox(
                    folderName
                )
            );

        }
    );


    content.appendChild(
        grid
    );

}


/* =========================================================
   OPEN FOLDER
========================================================= */

function openFolder(
    folderName
) {

    const newPath =
        currentPath.concat(
            folderName
        );


    setURLPath(
        newPath
    );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   BACK BUTTON
========================================================= */

backButton.addEventListener(
    "click",
    function() {

        if (
            currentPath.length === 0
        ) {

            return;

        }


        const parentPath =
            currentPath.slice(
                0,
                currentPath.length - 1
            );


        setURLPath(
            parentPath
        );


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }
);


/* =========================================================
   PHONE / BROWSER BACK
========================================================= */

window.addEventListener(
    "hashchange",
    function() {

        const path =
            decodePath();


        rebuildFromPath(
            path
        );


        searchBox.value =
            "";


        showCurrentFolder();


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }
);


/* =========================================================
   SEARCH
========================================================= */

function searchTree(
    node,
    path,
    text,
    results
) {

    if (
        !node ||
        typeof node !== "object"
    ) {

        return;

    }


    Object.keys(node).forEach(
        function(name) {

            const newPath =
                path.concat(name);


            if (
                name
                    .toLowerCase()
                    .includes(text)
            ) {

                results.push({

                    name: name,

                    path: newPath

                });

            }


            if (
                node[name] &&
                typeof node[name]
                === "object"
            ) {

                searchTree(
                    node[name],
                    newPath,
                    text,
                    results
                );

            }

        }
    );

}


/* =========================================================
   PERFORM SEARCH
========================================================= */

function performSearch(text) {

    text =
        text.trim().toLowerCase();


    if (!text) {

        showCurrentFolder();

        return;

    }


    const results = [];


    searchTree(
        database,
        [],
        text,
        results
    );


    content.innerHTML =
        "";


    pathDisplay.innerHTML = `

        <span class="path-item">

            SEARCH RESULTS

        </span>

    `;


    if (
        results.length === 0
    ) {

        content.innerHTML = `

            <div class="no-results">

                No matching folder found.

            </div>

        `;

        return;

    }


    const grid =
        document.createElement("div");


    grid.className =
        "folder-grid";


    results.forEach(
        function(result) {

            const item =
                document.createElement("div");


            item.className =
                "folder";


            item.innerHTML = `

                <div>

                    <div class="folder-title">

                        ${escapeHTML(
                            result.name
                        )}

                    </div>

                    <div class="result-path">

                        ${escapeHTML(
                            result.path.join(
                                " → "
                            )
                        )}

                    </div>

                </div>

            `;


            item.addEventListener(
                "click",
                function() {

                    setURLPath(
                        result.path
                    );

                    searchBox.value =
                        "";

                }
            );


            grid.appendChild(
                item
            );

        }
    );


    content.appendChild(
        grid
    );

}


/* =========================================================
   SEARCH EVENT
========================================================= */

searchBox.addEventListener(
    "input",
    function() {

        performSearch(
            this.value
        );

    }
);


/* =========================================================
   START
========================================================= */

const initialPath =
    decodePath();


rebuildFromPath(
    initialPath
);


showCurrentFolder();

</script>
