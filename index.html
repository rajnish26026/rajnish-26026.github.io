}

}

/* =========================================================
   MIX COLORS
   ========================================================= */

function mixWithWhite(hex, amount) {

    const num =
        parseInt(
            hex.replace("#", ""),
            16
        );

    let r =
        (num >> 16) & 255;

    let g =
        (num >> 8) & 255;

    let b =
        num & 255;

    r =
        Math.round(
            r + (255 - r) * amount
        );

    g =
        Math.round(
            g + (255 - g) * amount
        );

    b =
        Math.round(
            b + (255 - b) * amount
        );

    return "#" +
        [r, g, b]
            .map(function(v) {
                return v
                    .toString(16)
                    .padStart(2, "0");
            })
            .join("");

}


/* =========================================================

function getFolderTheme(name, path) {

    if (CATEGORY_COLORS[name]) {
        return CATEGORY_COLORS[name];

    if (TYPE_COLORS[name]) {
        return TYPE_COLORS[name];
    }

    if (path.length === 0) {

        return ROOT_COLORS[name] ||
            DEFAULT_THEME;

    }

    const rootTheme =
        ROOT_COLORS[path[0]];

    if (rootTheme) {

        return {

            bg:
                mixWithWhite(
                    rootTheme.border,
                    0.82
                ),

            border:
                mixWithWhite(
                    rootTheme.border,
                    0.35
                ),

            text:
                rootTheme.text

        };

    }

    return DEFAULT_THEME;

}
