<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PCB REPAIR DATA</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
    color: #1f2937;
}

header {
    background: #1f2937;
    color: white;
    padding: 22px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 800;
}

header p {
    margin: 8px 0 0;
    font-size: 16px;
    font-weight: 700;
}

.search-area {
    background: white;
    padding: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 7px rgba(0,0,0,.10);
}

.search-box {
    width: 95%;
    max-width: 700px;
    display: block;
    margin: auto;
    padding: 14px 16px;
    border: 2px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

.search-box:focus {
    border-color: #2563eb;
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 15px;
}

.path {
    background: #dbeafe;
    border-left: 5px solid #2563eb;
    padding: 14px 15px;
    border-radius: 9px;
    margin-bottom: 14px;
    font-size: 15px;
    font-weight: 800;
    color: #1e3a8a;
    line-height: 1.5;
    word-break: break-word;
    box-shadow: 0 2px 5px rgba(0,0,0,.08);
}

.back-button {
    display: none;
    border: none;
    background: #2563eb;
    color: white;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    cursor: pointer;
}

.folder {
    background: white;
    margin: 11px 0;
    padding: 19px 18px;
    border-radius: 11px;
    border: 2px solid #dbe3ee;
    box-shadow: 0 3px 8px rgba(0,0,0,.08);
    cursor: pointer;
}

.folder:active {
    transform: scale(.985);
}

.folder-title {
    font-size: 18px;
    font-weight: 800;
    color: #111827;
}

.file-placeholder {
    background: white;
    padding: 30px 20px;
    text-align: center;
    border-radius: 11px;
    color: #6b7280;
    font-weight: 600;
}

footer {
    text-align: center;
    padding: 30px 15px;
    color: #6b7280;
    font-size: 14px;
    font-weight: 600;
}

@media (max-width: 600px) {

    header h1 {
        font-size: 25px;
    }

    header p {
        font-size: 14px;
    }

    .container {
        padding: 12px;
    }

    .folder {
        padding: 18px 15px;
    }

    .folder-title {
        font-size: 17px;
    }

}

</style>
</head>


<body>

<header>

    <h1>PCB REPAIR DATA</h1>

    <p>PCB REPAIR DATABASE</p>

</header>


<div class="search-area">

    <input
        id="searchBox"
        class="search-box"
        type="search"
        placeholder="Search IC, error code, brand, model..."
        autocomplete="off">

</div>


<div class="container">

    <button
        id="backButton"
        class="back-button"
        type="button">

        ← Back

    </button>


    <div id="pathDisplay" class="path">

        📁 Home

    </div>


    <!--
        MAIN HOME FOLDERS ARE DIRECTLY IN HTML.
        They will ALWAYS be visible on Home.
    -->

    <div id="content">

        <div class="folder" data-folder="AC">
            <div class="folder-title">📁 AC</div>
        </div>

        <div class="folder" data-folder="Fridge">
            <div class="folder-title">📁 Fridge</div>
        </div>

        <div class="folder" data-folder="Washing Machine">
            <div class="folder-title">📁 Washing Machine</div>
        </div>

        <div class="folder" data-folder="Microwave Oven">
            <div class="folder-title">📁 Microwave Oven</div>
        </div>

        <div class="folder" data-folder="Induction Cooktop">
            <div class="folder-title">📁 Induction Cooktop</div>
        </div>

        <div class="folder" data-folder="Chimney PCB">
            <div class="folder-title">📁 Chimney PCB</div>
        </div>

        <div class="folder" data-folder="R O PCB">
            <div class="folder-title">📁 R O PCB</div>
        </div>

        <div class="folder" data-folder="Circuit Diagrams">
            <div class="folder-title">📁 Circuit Diagrams</div>
        </div>

        <div class="folder" data-folder="Electronic Components">
            <div class="folder-title">📁 Electronic Components</div>
        </div>

        <div class="folder" data-folder="Error Codes">
            <div class="folder-title">📁 Error Codes</div>
        </div>

        <div class="folder" data-folder="PCB Test Points">
            <div class="folder-title">📁 PCB Test Points</div>
        </div>

        <div class="folder" data-folder="PDF">
            <div class="folder-title">📁 PDF</div>
        </div>

        <div class="folder" data-folder="Photos">
            <div class="folder-title">📁 Photos</div>
        </div>

        <div class="folder" data-folder="Software Data">
            <div class="folder-title">📁 Software Data</div>
        </div>

        <div class="folder" data-folder="Videos">
            <div class="folder-title">📁 Videos</div>
        </div>

    </div>

</div>


<footer>

    PCB REPAIR DATABASE

</footer>


<script>

/* =========================================================
   FOLDER CREATOR
========================================================= */

function makeFolders(names) {

    const result = {};

    names.forEach(function(name) {
        result[name] = {};
    });

    return result;
}


/* =========================================================
   AC
========================================================= */

const acTypes = [
    "Inverter Window",
    "Inverter Split",
    "Inverter Cassette",
    "Inverter Ductable",
    "Non Inverter Window",
    "Non Inverter Split",
    "Non Inverter Cassette",
    "Non Inverter Ductable"
];

const AC = {

    "Circuit Diagrams": makeFolders(acTypes),

    "EEPROM BIN Files": makeFolders(acTypes),

    "Error Codes": makeFolders(acTypes),

    "Inverter AC": {
        "Window": {},
        "Split": {},
        "Cassette": {},
        "Ductable": {}
    },

    "Non Inverter AC": {
        "Window": {},
        "Split": {},
        "Cassette": {},
        "Ductable": {}
    },

    "PDF": makeFolders(acTypes),

    "Photos": makeFolders(acTypes),

    "Remote Photos": makeFolders(acTypes),

    "Sensor Details": makeFolders(acTypes),

    "Test Points": makeFolders(acTypes)

};


/* =========================================================
   FRIDGE
========================================================= */

const fridgeTypes = [
    "Inverter Single Door",
    "Inverter Double Door",
    "Inverter Triple Door",
    "Inverter Side by Side",
    "Non Inverter Single Door",
    "Non Inverter Double Door",
    "Non Inverter Triple Door",
    "Non Inverter Side by Side"
];

const Fridge = {

    "Circuit Diagrams": makeFolders(fridgeTypes),

    "EEPROM BIN Files": makeFolders(fridgeTypes),

    "Error Codes": makeFolders(fridgeTypes),

    "Inverter PCB": {

        "Inverter Single Door": {},
        "Inverter Double Door": {},
        "Inverter Triple Door": {},
        "Inverter Side by Side": {}

    },

    "Photos": makeFolders(fridgeTypes),

    "Sensor Details": makeFolders(fridgeTypes),

    "Signal PCB": makeFolders(fridgeTypes),

    "Videos": makeFolders(fridgeTypes),

    "Wiring Details": makeFolders(fridgeTypes)

};


/* =========================================================
   WASHING MACHINE
   NO REMOTE PHOTOS
========================================================= */

const washingMachineTypes = [
    "Inverter Top Load",
    "Inverter Front Load",
    "Non Inverter Top Load",
    "Non Inverter Front Load"
];

const WashingMachine = {

    "Circuit Diagrams": makeFolders(washingMachineTypes),

    "EEPROM BIN Files": makeFolders(washingMachineTypes),

    "Error Codes": makeFolders(washingMachineTypes),

    "Photos": makeFolders(washingMachineTypes),

    "Test Points": makeFolders(washingMachineTypes),

    "Videos": makeFolders(washingMachineTypes),

    "Wiring Details": makeFolders(washingMachineTypes)

};


/* =========================================================
   MICROWAVE
========================================================= */

const microwaveTypes = [
    "Inverter",
    "Non Inverter"
];

const MicrowaveOven = {

    "MW Oven Touch": makeFolders(microwaveTypes),

    "MW Oven Wiring": makeFolders(microwaveTypes)

};


/* =========================================================
   OTHER MAIN FOLDERS
========================================================= */

const InductionCooktop = {

    "Circuit Diagrams": {},
    "Error Codes": {},
    "Photos": {},
    "Videos": {},
    "Test Points": {},
    "Wiring Details": {},
    "PDF": {}

};


const ChimneyPCB = {

    "Circuit Diagrams": {},
    "Error Codes": {},
    "Photos": {},
    "Videos": {},
    "Test Points": {},
    "Wiring Details": {},
    "PDF": {}

};


const ROPCB = {

    "Circuit Diagrams": {},
    "Error Codes": {},
    "EEPROM BIN Files": {},
    "Photos": {},
    "Videos": {},
    "Test Points": {},
    "Wiring Details": {},
    "Sensor Details": {},
    "PDF": {}

};


/* =========================================================
   CIRCUIT DIAGRAMS
========================================================= */

const CircuitDiagrams = {

    "AC": makeFolders(acTypes),

    "Fridge": makeFolders(fridgeTypes),

    "Washing Machine": makeFolders(washingMachineTypes),

    "Microwave Oven": makeFolders(microwaveTypes),

    "Induction Cooktop": {},

    "Chimney PCB": {},

    "R O PCB": {}

};


/* =========================================================
   PCB TEST POINTS
========================================================= */

const PCBTestPoints = {

    "AC": makeFolders(acTypes),

    "Fridge": makeFolders(fridgeTypes),

    "Washing Machine": makeFolders(washingMachineTypes)

};


/* =========================================================
   PHOTOS
========================================================= */

const Photos = {

    "AC": makeFolders(acTypes),

    "Fridge": makeFolders(fridgeTypes),

    "Washing Machine": makeFolders(washingMachineTypes),

    "Microwave Oven": {},

    "Induction Cooktop": {},

    "Chimney PCB": {},

    "R O PCB": {},

    "Misc": {}

};


/* =========================================================
   VIDEOS
========================================================= */

const Videos = {

    "AC": makeFolders(acTypes),

    "Fridge": makeFolders(fridgeTypes),

    "Washing Machine": makeFolders(washingMachineTypes),

    "Microwave Oven": {},

    "Induction Cooktop": {},

    "Chimney PCB": {},

    "R O PCB": {},

    "Misc": {}

};


/* =========================================================
   SOFTWARE DATA
========================================================= */

const SoftwareData = {

    "EEPROM Data": {

        "AC": {

            "Inverter Indoor PCB": {},
            "Non Inverter Indoor PCB": {},
            "Inverter ODU PCB": {},
            "Non Inverter ODU PCB": {}

        },

        "Fridge": {

            "Single Door": {
                "Inverter": {},
                "Non Inverter": {}
            },

            "Double Door": {
                "Inverter": {},
                "Non Inverter": {}
            },

            "Triple Door": {
                "Inverter": {},
                "Non Inverter": {}
            },

            "Side by Side": {
                "Inverter": {},
                "Non Inverter": {}
            },

            "Fridge Signal Card": {},

            "Fridge Inverter Card": {}

        },

        "Washing Machine": {

            "Inverter Top Load": {},
            "Inverter Front Load": {},
            "Non Inverter Top Load": {},
            "Non Inverter Front Load": {}

        }

    },

    "MCU Data": {}

};


/* =========================================================
   MAIN DATABASE
========================================================= */

const database = {

    "AC": AC,

    "Fridge": Fridge,

    "Washing Machine": WashingMachine,

    "Microwave Oven": MicrowaveOven,

    "Induction Cooktop": InductionCooktop,

    "Chimney PCB": ChimneyPCB,

    "R O PCB": ROPCB,

    "Circuit Diagrams": CircuitDiagrams,

    "Electronic Components": {},

    "Error Codes": {},

    "PCB Test Points": PCBTestPoints,

    "PDF": {},

    "Photos": Photos,

    "Software Data": SoftwareData,

    "Videos": Videos

};


/* =========================================================
   APP STATE
========================================================= */

let currentNode = database;

let currentPath = [];


/* =========================================================
   ELEMENTS
========================================================= */

const content =
    document.getElementById("content");

const pathDisplay =
    document.getElementById("pathDisplay");

const backButton =
    document.getElementById("backButton");

const searchBox =
    document.getElementById("searchBox");


/* =========================================================
   DISPLAY FOLDER
========================================================= */

function displayFolder() {

    content.innerHTML = "";

    pathDisplay.textContent =
        currentPath.length === 0
        ? "📁 Home"
        : "📁 " + currentPath.join(" → ");


    backButton.style.display =
        currentPath.length === 0
        ? "none"
        : "inline-block";


    const names =
        Object.keys(currentNode);


    if (names.length === 0) {

        content.innerHTML = `
            <div class="file-placeholder">
                📂 This folder is currently empty.
            </div>
        `;

        return;
    }


    names.forEach(function(name) {

        const folder =
            document.createElement("div");

        folder.className = "folder";

        folder.innerHTML = `
            <div class="folder-title">
                📁 ${name}
            </div>
        `;


        folder.onclick = function() {

            currentNode =
                currentNode[name];

            currentPath.push(name);

            displayFolder();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        };


        content.appendChild(folder);

    });

}


/* =========================================================
   BACK BUTTON
========================================================= */

backButton.onclick = function() {

    goBack();

};


function goBack() {

    if (currentPath.length === 0) {
        return;
    }


    currentPath.pop();

    currentNode = database;


    currentPath.forEach(function(name) {

        currentNode =
            currentNode[name];

    });


    displayFolder();

}


/* =========================================================
   PHONE BACK BUTTON
========================================================= */

window.addEventListener(
    "popstate",
    function() {

        goBack();

    }
);


/* =========================================================
   SEARCH
========================================================= */

function searchTree(
    node,
    path,
    text,
    results
) {

    Object.keys(node).forEach(function(name) {

        const newPath =
            path.concat(name);


        if (
            name.toLowerCase().includes(text)
        ) {

            results.push({
                name: name,
                path: newPath
            });

        }


        if (
            node[name] &&
            typeof node[name] === "object"
        ) {

            searchTree(
                node[name],
                newPath,
                text,
                results
            );

        }

    });

}


function performSearch(text) {

    text =
        text.trim().toLowerCase();


    if (!text) {

        displayFolder();

        return;

    }


    const results = [];


    searchTree(
        database,
        [],
        text,
        results
    );


    content.innerHTML = "";

    pathDisplay.textContent =
        "🔎 Search Results";


    results.forEach(function(result) {

        const item =
            document.createElement("div");

        item.className =
            "folder";


        item.innerHTML = `

            <div class="folder-title">

                📁 ${result.name}

            </div>

            <div class="result-path">

                ${result.path.join(" → ")}

            </div>

        `;


        item.onclick = function() {

            currentNode = database;

            currentPath = [];


            result.path.forEach(function(name) {

                currentNode =
                    currentNode[name];

                currentPath.push(name);

            });


            searchBox.value = "";

            displayFolder();

        };


        content.appendChild(item);

    });


    if (results.length === 0) {

        content.innerHTML = `

            <div class="file-placeholder">

                No matching folder found.

            </div>

        `;

    }

}


/* =========================================================
   SEARCH EVENT
========================================================= */

searchBox.addEventListener(
    "input",
    function() {

        performSearch(this.value);

    }
);


/* =========================================================
   IMPORTANT:
   DO NOT call displayFolder() on startup.
   Home folders are already written directly
   in the HTML above.
========================================================= */

</script>

</body>
</html>
