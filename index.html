<style>

/* =========================================================
   BASIC
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
    color: #1f2937;
}


/* =========================================================
   HEADER
========================================================= */

header {
    background: #172033;
    color: white;
    padding: 22px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: .5px;
}

header p {
    margin: 8px 0 0;
    font-size: 16px;
    font-weight: 700;
}


/* =========================================================
   SEARCH
========================================================= */

.search-area {
    background: white;
    padding: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.10);
}

.search-box {
    width: 95%;
    max-width: 700px;
    display: block;
    margin: auto;

    padding: 14px 16px;

    border: 2px solid #d1d5db;
    border-radius: 12px;

    font-size: 17px;
    font-weight: 600;

    outline: none;
}

.search-box:focus {
    border-color: #2563eb;
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}


/* =========================================================
   TREE PATH
========================================================= */

.path {
    background: #dbeafe;

    border-left: 6px solid #2563eb;

    padding: 13px 15px;

    border-radius: 10px;

    margin-bottom: 15px;

    font-size: 16px;
    font-weight: 900;

    color: #172554;

    line-height: 1.6;

    word-break: break-word;

    box-shadow: 0 3px 8px rgba(0,0,0,.08);
}

.path-item {
    font-weight: 900;
    color: #111827;
}

.path-arrow {
    font-weight: 900;
    color: #2563eb;

    padding: 0 6px;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-button {

    display: none;

    border: none;

    background: #2563eb;

    color: white;

    padding: 11px 20px;

    border-radius: 9px;

    font-size: 16px;

    font-weight: 800;

    margin-bottom: 14px;

    cursor: pointer;

    box-shadow: 0 3px 7px rgba(0,0,0,.15);
}

.back-button:hover {
    background: #1d4ed8;
}

.back-button:active {
    transform: scale(.97);
}


/* =========================================================
   FOLDER GRID
========================================================= */

#content {

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 15px;

    align-items: stretch;
}


/* =========================================================
   FOLDER BOX
========================================================= */

.folder {

    min-height: 145px;

    padding: 18px 12px;

    border-radius: 16px;

    border: 2px solid rgba(255,255,255,.85);

    box-shadow:
        0 5px 14px rgba(0,0,0,.12);

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    user-select: none;

    -webkit-user-select: none;

    touch-action: manipulation;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        opacity .18s ease;

    position: relative;

    overflow: hidden;
}


/* subtle shine */

.folder::before {

    content: "";

    position: absolute;

    top: -45%;

    left: -25%;

    width: 150%;

    height: 100%;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.28),
            transparent 60%
        );

    pointer-events: none;
}


.folder:hover {

    transform:
        translateY(-4px);

    box-shadow:
        0 9px 20px rgba(0,0,0,.18);
}


.folder:active {

    transform:
        scale(.97);
}


/* =========================================================
   DRAGGING
========================================================= */

.folder.dragging {

    opacity: .45;

    transform:
        scale(.96);

    box-shadow:
        0 2px 5px rgba(0,0,0,.10);
}


/* =========================================================
   FOLDER TITLE
========================================================= */

.folder-title {

    position: relative;

    z-index: 2;

    font-size: 20px;

    font-weight: 900;

    line-height: 1.35;

    color: #111827;

    max-width: 100%;

    word-break: break-word;

    overflow-wrap: anywhere;

/* =========================================================
   EMPTY FOLDER
========================================================= */

.file-placeholder,

    grid-column: 1 / -1;

    background: white;

    padding: 35px 20px;

    text-align: center;

    border-radius: 14px;

    color: #6b7280;

    font-size: 17px;

    font-weight: 700;

    box-shadow:
        0 3px 9px rgba(0,0,0,.08);

/* =========================================================

========================================================= */

    margin-top: 9px;

    font-weight: 700;

    line-height: 1.5;

/* Search results use smaller cards */

}


/* =========================================================
   FOOTER
========================================================= */

footer {

    text-align: center;

    padding: 30px 15px;

    color: #6b7280;

    font-size: 14px;

    font-weight: 600;

/* =========================================================
   TABLET
========================================================= */

@media (max-width: 850px) {

/* =========================================================

========================================================= */

@media (max-width: 380px) {

/* =========================================================

========================================================= */

const boxColors = [

    "#fef3c7",
    "#fce7f3",
    "#ede9fe",
    "#cffafe",
    "#ffedd5",

    "#fef9c3",
    "#fae8ff",
    "#e0f2fe"

];


/* =========================================================
   STATE
========================================================= */

let currentNode = database;

let currentPath = [];


/* =========================================================
   ELEMENTS
========================================================= */

const content =
    document.getElementById("content");

const pathDisplay =
    document.getElementById("pathDisplay");

const backButton =
    document.getElementById("backButton");

const searchBox =
    document.getElementById("searchBox");


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================================================
   PATH ENCODING
========================================================= */

function encodePath(path) {

    return path

        .map(function(item) {

            return encodeURIComponent(item);

        })

        .join("/");

}


/* =========================================================
   PATH DECODING
========================================================= */

function decodePath() {

    const hash =
        window.location.hash;


    if (
        !hash ||
        hash === "#"
    ) {

        return [];

    }


    const raw =
        hash.substring(1);


    if (!raw) {

        return [];

    }


    return raw

        .split("/")

        .map(function(item) {

            return decodeURIComponent(item);

        });

}


/* =========================================================
   URL PATH
========================================================= */

function setURLPath(path) {

    const newHash =
        encodePath(path);


    if (
        window.location.hash.substring(1)
        === newHash
    ) {

        return;

    }


    window.location.hash =
        newHash;

}


/* =========================================================
   REBUILD NODE
========================================================= */

function rebuildFromPath(path) {

    currentNode =
        database;

    currentPath = [];


    for (
        let i = 0;
        i < path.length;
        i++
    ) {

        const name =
            path[i];


        if (
            !currentNode ||

            !Object.prototype.hasOwnProperty.call(
                currentNode,
                name
            )
        ) {

            currentNode =
                database;

            currentPath = [];

            return;

        }


        currentNode =
            currentNode[name];

        currentPath.push(name);

    }

}


/* =========================================================
   PATH DISPLAY
========================================================= */

function updatePath() {

    /*
       Home is intentionally NOT displayed.
    */

    if (
        currentPath.length === 0
    ) {

        pathDisplay.innerHTML = "";

        pathDisplay.style.display =
            "none";

        return;

    }


    pathDisplay.style.display =
        "block";


    let html = "";


    currentPath.forEach(function(name, index) {

        if (index > 0) {

            html += `

                <span class="path-arrow">

                    →

                </span>

            `;

        }


        html += `

            <span class="path-item">

                ${escapeHTML(name)}

            </span>

        `;

    });


    pathDisplay.innerHTML =
        html;

}


/* =========================================================
   BACK BUTTON
========================================================= */

function updateBackButton() {

    if (
        currentPath.length === 0
    ) {

        backButton.style.display =
            "none";

    } else {

        backButton.style.display =
            "inline-block";

    }

}


/* =========================================================
   STORAGE KEY
========================================================= */

function getStorageKey() {

    return "pcb_folder_order_" +
        currentPath.join("||");

}


/* =========================================================
   GET SAVED ORDER
========================================================= */

function getSavedOrder(folderNames) {

    try {

        const saved =
            localStorage.getItem(
                getStorageKey()
            );


        if (!saved) {

            return folderNames;

        }


        const savedNames =
            JSON.parse(saved);


        if (
            !Array.isArray(savedNames)
        ) {

            return folderNames;

        }


        const result = [];


        savedNames.forEach(function(name) {

            if (
                folderNames.includes(name)
            ) {

                result.push(name);

            }

        });


        folderNames.forEach(function(name) {

            if (
                !result.includes(name)
            ) {

                result.push(name);

            }

        });


        return result;

    } catch (error) {

        return folderNames;

    }

}


/* =========================================================
   SAVE ORDER
========================================================= */

function saveOrder(names) {

    try {

        localStorage.setItem(

            getStorageKey(),

            JSON.stringify(names)

        );

    } catch (error) {

        console.log(
            "Could not save folder order."
        );

    }

}


/* =========================================================
   DRAG AND DROP
========================================================= */

let draggedFolder = null;


/* =========================================================
   HANDLE DRAG START
========================================================= */

function handleDragStart(event) {

    draggedFolder =
        event.currentTarget;


    draggedFolder.classList.add(
        "dragging"
    );


    event.dataTransfer.effectAllowed =
        "move";


    event.dataTransfer.setData(
        "text/plain",
        draggedFolder.dataset.name
    );

}


/* =========================================================
   HANDLE DRAG END
========================================================= */

function handleDragEnd() {

    if (draggedFolder) {

        draggedFolder.classList.remove(
            "dragging"
        );

    }


    draggedFolder = null;


    saveCurrentVisualOrder();

}


/* =========================================================
   HANDLE DRAG OVER
========================================================= */

function handleDragOver(event) {

    event.preventDefault();


    if (
        !draggedFolder
    ) {

        return;

    }


    const target =
        event.currentTarget;


    if (
        target === draggedFolder
    ) {

        return;

    }


    const rect =
        target.getBoundingClientRect();


    const middle =
        rect.left +
        rect.width / 2;


    if (
        event.clientX < middle
    ) {

        content.insertBefore(
            draggedFolder,
            target
        );

    } else {

        content.insertBefore(
            draggedFolder,
            target.nextSibling
        );

    }

}


/* =========================================================
   SAVE CURRENT VISUAL ORDER
========================================================= */

function saveCurrentVisualOrder() {

    const names = [];


    const folders =
        content.querySelectorAll(
            ".folder"
        );


    folders.forEach(function(folder) {

        if (
            folder.dataset.name
        ) {

            names.push(
                folder.dataset.name
            );

        }

    });


    if (
        names.length > 0
    ) {

        saveOrder(names);

    }

}


/* =========================================================
   SHOW CURRENT FOLDER
========================================================= */

function showCurrentFolder() {

    content.innerHTML = "";


    updatePath();

    updateBackButton();


    let folderNames =
        Object.keys(currentNode);


    if (
        folderNames.length === 0
    ) {

        const empty =
            document.createElement("div");


        empty.className =
            "file-placeholder";


        empty.textContent =
            "This folder is currently empty.";


        content.appendChild(
            empty
        );


        return;

    }


    /*
       Apply saved user arrangement.
    */

    folderNames =
        getSavedOrder(folderNames);


    folderNames.forEach(
        function(folderName, index) {

            const folder =
                document.createElement("div");


            folder.className =
                "folder";


            folder.dataset.name =
                folderName;


            folder.draggable =
                true;


            /*
               Different professional
               background color.
            */

            folder.style.background =
                boxColors[
                    index %
                    boxColors.length
                ];


            folder.innerHTML = `

                <div class="folder-title">

                    ${escapeHTML(folderName)}

                </div>

            `;


            /* CLICK */

            folder.addEventListener(
                "click",
                function(event) {

                    /*
                       Prevent accidental opening
                       immediately after dragging.
                    */

                    if (
                        folder.classList.contains(
                            "was-dragged"
                        )
                    ) {

                        folder.classList.remove(
                            "was-dragged"
                        );

                        return;

                    }


                    openFolder(
                        folderName
                    );

                }
            );


            /* DRAG */

            folder.addEventListener(
                "dragstart",
                handleDragStart
            );


            folder.addEventListener(
                "dragend",
                function() {

                    handleDragEnd();

                    folder.classList.add(
                        "was-dragged"
                    );

                    setTimeout(function() {

                        folder.classList.remove(
                            "was-dragged"
                        );

                    }, 300);

                }
            );


            folder.addEventListener(
                "dragover",
                handleDragOver
            );


            content.appendChild(
                folder
            );

        }
    );

}


/* =========================================================
   OPEN FOLDER
========================================================= */

function openFolder(folderName) {

    const newPath =
        currentPath.concat(
            folderName
        );


    setURLPath(
        newPath
    );

}


/* =========================================================
   APP BACK BUTTON
========================================================= */

backButton.addEventListener(
    "click",
    function() {

        if (
            currentPath.length === 0
        ) {

            return;

        }


        const parentPath =
            currentPath.slice(
                0,
                currentPath.length - 1
            );


        setURLPath(
            parentPath
        );

    }
);


/* =========================================================
   PHONE / BROWSER BACK
========================================================= */

window.addEventListener(
    "hashchange",
    function() {

        const path =
            decodePath();


        rebuildFromPath(
            path
        );


        searchBox.value =
            "";


        showCurrentFolder();


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }
);


/* =========================================================
   SEARCH TREE
========================================================= */

function searchTree(
    node,
    path,
    text,
    results
) {

    if (
        !node ||
        typeof node !== "object"
    ) {

        return;

    }


    Object.keys(node).forEach(
        function(name) {

            const newPath =
                path.concat(name);


            if (
                name
                    .toLowerCase()
                    .includes(text)
            ) {

                results.push({

                    name: name,

                    path: newPath

                });

            }


            if (
                node[name] &&
                typeof node[name] === "object"
            ) {

                searchTree(

                    node[name],

                    newPath,

                    text,

                    results

                );

            }

        }
    );

}


/* =========================================================
   SEARCH
========================================================= */

function performSearch(text) {

    text =
        text.trim().toLowerCase();


    if (!text) {

        showCurrentFolder();

        return;

    }


    const results = [];


    searchTree(

        database,

        [],

        text,

        results

    );


    content.innerHTML = "";


    pathDisplay.style.display =
        "block";


    pathDisplay.innerHTML = `

        <span class="path-item">

            Search Results

        </span>

    `;


    backButton.style.display =
        "none";


    if (
        results.length === 0
    ) {

        const empty =
            document.createElement("div");


        empty.className =
            "no-results";


        empty.textContent =
            "No matching folder found.";


        content.appendChild(
            empty
        );


        return;

    }


    results.forEach(
        function(result, index) {

            const item =
                document.createElement("div");


            item.className =
                "folder search-result";


            item.style.background =
                boxColors[
                    index %
                    boxColors.length
                ];


            item.innerHTML = `

                <div>

                    <div class="folder-title">

                        ${escapeHTML(
                            result.name
                        )}

                    </div>

                    <div class="result-path">

                        ${escapeHTML(
                            result.path.join(
                                " → "
                            )
                        )}

                    </div>

                </div>

            `;


            item.addEventListener(
                "click",
                function() {

                    searchBox.value =
                        "";

                    setURLPath(
                        result.path
                    );

                }
            );


            content.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   SEARCH EVENT
========================================================= */

searchBox.addEventListener(
    "input",
    function() {

        performSearch(
            this.value
        );

    }
);


/* =========================================================
   START APPLICATION
========================================================= */

const initialPath =
    decodePath();


rebuildFromPath(
    initialPath
);


showCurrentFolder();

</script>

</body>

</html>
