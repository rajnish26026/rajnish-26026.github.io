}

.toolbar {
    display: flex;

}

button {

    border-radius: 9px;

#folderGrid {

}

.folder {
    min-height: 82px;
    border-radius: 14px;
    padding: 13px 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 2px 7px rgba(0,0,0,.12);
    user-select: none;
    word-break: break-word;
    transition: transform .12s ease;
}

.folder:active {
    transform: scale(.97);
}

.folder.dragging {
    opacity: .45;
}

.no-results {

    text-align: center;

/* =========================================================
   DRIVE LINK ATTACHMENT
   ========================================================= */

function normalizeKey(parts) {
    return parts.join("|")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
}

function attachDriveLinks(obj, path = []) {

    Object.keys(obj).forEach(function(name) {

        const currentPath = [...path, name];

        let link = null;

        const exactKey = currentPath.join("|");

        if (DRIVE_LINKS[exactKey]) {
            link = DRIVE_LINKS[exactKey];
        }

        if (link) {
            obj[name].__DRIVE__ = link;
        }

        attachDriveLinks(obj[name], currentPath);
    });
}

attachDriveLinks(database);


/* =========================================================
   NAVIGATION
   ========================================================= */

let currentFolder = database;
let currentPath = [];

const folderGrid = document.getElementById("folderGrid");
const pathDisplay = document.getElementById("path");
const searchBox = document.getElementById("searchBox");


/* =========================================================
   LOCAL STORAGE ORDER
   ========================================================= */

function getStorageKey(path) {
    return "pcb-order-" + path.join("/");
}

function applySavedOrder(obj, path) {

    const key = getStorageKey(path);

    const saved = localStorage.getItem(key);

    if (!saved) return Object.keys(obj);

    try {

        const savedOrder = JSON.parse(saved);

        const existing = Object.keys(obj);

        const ordered = [];

        savedOrder.forEach(function(name) {
            if (existing.includes(name)) {
                ordered.push(name);
            }
        });

        existing.forEach(function(name) {
            if (!ordered.includes(name)) {
                ordered.push(name);
            }
        });

        return ordered;

    } catch (e) {

        return Object.keys(obj);
    }
}


/* =========================================================
   FOLDER COLOUR
   ========================================================= */

function getFolderClass(name, path) {

    const lower = name.toLowerCase();

    if (path.length === 1) {

        if (lower === "ac") return "ac-folder";
        if (lower === "fridge") return "fridge-folder";
        if (lower.includes("washing")) return "wm-folder";
        if (lower.includes("microwave")) return "mw-folder";
        if (lower.includes("induction")) return "induction-folder";
        if (lower.includes("chimney")) return "chimney-folder";
        if (lower.includes("r o")) return "ro-folder";
        if (lower.includes("circuit")) return "circuit-folder";
        if (lower.includes("electronic")) return "component-folder";
        if (lower.includes("error")) return "error-folder";
        if (lower.includes("test")) return "testpoint-folder";
        if (lower.includes("pdf")) return "pdf-folder";
        if (lower.includes("photo")) return "photo-folder";
        if (lower.includes("software")) return "software-folder";
        if (lower.includes("video")) return "video-folder";
    }

    if (lower.includes("error")) return "error-folder";
    if (lower.includes("circuit")) return "circuit-folder";
    if (lower.includes("pdf")) return "pdf-folder";
    if (lower.includes("photo")) return "photo-folder";
    if (lower.includes("video")) return "video-folder";
    if (lower.includes("test")) return "testpoint-folder";
    if (lower.includes("software")) return "software-folder";
    if (lower.includes("component")) return "component-folder";

    return "root-folder";
}


/* =========================================================
   SHOW FOLDER
   ========================================================= */

function showFolder(obj, path) {

    currentFolder = obj;
    currentPath = path;

    folderGrid.innerHTML = "";

    updatePath();

    const names = applySavedOrder(obj, path);

    if (names.length === 0) {

        folderGrid.innerHTML =
            '<div class="no-results">No folders found.</div>';

        return;
    }

    names.forEach(function(name) {

        if (name === "__DRIVE__") return;

        const folder = obj[name];

        const div = document.createElement("div");

        div.className =
            "folder " +
            getFolderClass(name, path);

        div.textContent = name;

        div.draggable = true;

        div.dataset.name = name;

        div.addEventListener("click", function() {

            openFolder(name, folder);
        });

        div.addEventListener("dragstart", function() {

            div.classList.add("dragging");
        });

        div.addEventListener("dragend", function() {

            div.classList.remove("dragging");

            saveCurrentOrder();
        });

        div.addEventListener("dragover", function(e) {

            e.preventDefault();

            const dragging =
                document.querySelector(".dragging");

            if (!dragging || dragging === div) return;

            const rect =
                div.getBoundingClientRect();

            const middle =
                rect.top + rect.height / 2;

            if (e.clientY < middle) {

                div.parentNode.insertBefore(
                    dragging,
                    div
                );

            } else {

                div.parentNode.insertBefore(
                    dragging,
                    div.nextSibling
                );
            }
        });

        folderGrid.appendChild(div);
    });
}


/* =========================================================
   OPEN FOLDER
   ========================================================= */

function openFolder(name, folder) {

    const drive =
        folder.__DRIVE__;

    const children =
        Object.keys(folder)
            .filter(k => k !== "__DRIVE__");

    /*
       If folder contains subfolders,
       navigate inside website first.
    */

    if (children.length > 0) {

        currentPath.push(name);

        showFolder(folder, currentPath);

        return;
    }


    /*
       Leaf folder:
       Open Google Drive if linked.
    */

    if (drive) {

        window.open(
            drive,
            "_blank"
        );

        return;
    }


    /*
       If no Drive link but folder is empty,
       still show it.
    */

    currentPath.push(name);

    showFolder(folder, currentPath);
}


/* =========================================================
   PATH
   ========================================================= */

function updatePath() {

    if (currentPath.length === 0) {

        pathDisplay.textContent =
            "PCB REPAIR DATA";

        return;
    }

    pathDisplay.textContent =
        "PCB REPAIR DATA  /  " +
        currentPath.join("  /  ");
}


/* =========================================================
   BACK
   ========================================================= */

function goBack() {

    if (currentPath.length === 0) {
        return;
    }

    currentPath.pop();

    let obj = database;

    currentPath.forEach(function(name) {

        obj = obj[name];
    });

    showFolder(obj, currentPath);
}


/* =========================================================
   PHONE BACK BUTTON / BROWSER HISTORY
   ========================================================= */

function updateHistory() {

    location.hash =
        encodeURIComponent(
            currentPath.join("|")
        );
}

window.addEventListener("popstate", function() {

    const hash =
        decodeURIComponent(
            location.hash.replace("#", "")
        );

    if (!hash) {

        showFolder(database, []);

        return;
    }

    const parts =
        hash.split("|").filter(Boolean);

    let obj = database;
    let valid = true;

    parts.forEach(function(name) {

        if (obj[name]) {

            obj = obj[name];

        } else {

            valid = false;
        }
    });

    if (valid) {

        currentPath = parts;

        showFolder(obj, currentPath);

    } else {

        showFolder(database, []);
    }
});


/* =========================================================
   SEARCH
   ========================================================= */

function cleanSearchText(text) {

    return text
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "")
        .trim();
}


function searchDatabase(query) {

    const q =
        cleanSearchText(query);

    if (!q) {

        showFolder(currentFolder, currentPath);

        return;
    }

    const results = [];

    function walk(obj, path) {

        Object.keys(obj).forEach(function(name) {

            if (name === "__DRIVE__") return;

            const folder =
                obj[name];

            const newPath =
                [...path, name];

            const fullText =
                cleanSearchText(
                    newPath.join(" ")
                );

            if (fullText.includes(q)) {

                results.push({
                    name: name,
                    path: newPath,
                    folder: folder
                });
            }

            walk(folder, newPath);
        });
    }

    walk(database, []);

    folderGrid.innerHTML = "";

    pathDisplay.textContent =
        "Search results for: " + query;

    if (results.length === 0) {

        folderGrid.innerHTML =
            '<div class="no-results">No matching folder found.</div>';

        return;
    }

    results.forEach(function(result) {

        const div =
            document.createElement("div");

        div.className =
            "folder " +
            getFolderClass(
                result.name,
                result.path
            );

        div.textContent =
            result.path.join("  /  ");

        div.addEventListener("click", function() {

            const folder =
                result.folder;

            const drive =
                folder.__DRIVE__;

            const children =
                Object.keys(folder)
                    .filter(
                        k => k !== "__DRIVE__"
                    );

            if (drive && children.length === 0) {

                window.open(
                    drive,
                    "_blank"
                );

                return;
            }

            currentPath =
                result.path;

            currentFolder =
                folder;

            showFolder(
                folder,
                currentPath
            );
        });

        folderGrid.appendChild(div);
    });
}


searchBox.addEventListener(
    "input",
    function() {

        searchDatabase(
            searchBox.value
        );
    }
);


/* =========================================================
   SAVE DRAG ORDER
   ========================================================= */

function saveCurrentOrder() {

    if (currentPath.length === 0) {
        return;
    }

    const names =
        Array.from(
            folderGrid.children
        )
        .map(
            el => el.dataset.name
        )
        .filter(Boolean);

    localStorage.setItem(
        getStorageKey(currentPath),
        JSON.stringify(names)
    );
}


/* =========================================================
   REFRESH
   ========================================================= */

function refreshPage() {

    location.reload();
}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

showFolder(database, []);


/* =========================================================
   RESTORE HASH PATH
   ========================================================= */

if (location.hash) {

    const hash =
        decodeURIComponent(
            location.hash.replace("#", "")
        );

    if (hash) {

        const parts =
            hash.split("|")
                .filter(Boolean);

        let obj = database;
        let valid = true;

        parts.forEach(function(name) {

            if (obj[name]) {

                obj = obj[name];

            } else {

                valid = false;
            }
        });

        if (valid) {

            currentPath = parts;

            showFolder(
                obj,
                currentPath
            );
        }
    }
}
