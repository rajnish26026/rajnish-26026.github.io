<style>
* {
    box-sizing: border-box;
}

html,
body {

    padding: 0;
    min-height: 100%;
}

body {

}


/* HEADER */

header {
    background: #334155;
    color: white;
    padding: 22px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 800;
}

header p {
    margin: 8px 0 0;
    font-size: 16px;
    font-weight: 700;
}


/* SEARCH */

.search-area {
    background: white;
    padding: 14px;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 7px rgba(0,0,0,.10);
}

.search-box {
    width: 95%;
    max-width: 700px;
    display: block;
    margin: auto;
    padding: 14px 16px;
    border: 2px solid #cbd5e1;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

.search-box:focus {
    border-color: #2563eb;
}


/* MAIN */

.container {
    width: 100%;
    max-width: 1150px;
    margin: auto;
    padding: 15px;
    min-height: 500px;
}


/* TREE */

.path {
    background: #e0e7ff;
    border-left: 6px solid #2563eb;
    padding: 14px 15px;
    border-radius: 10px;
    margin-bottom: 14px;
    font-size: 15px;
    font-weight: 900;
    color: #334155;
    line-height: 1.8;
    word-break: break-word;
    box-shadow: 0 3px 8px rgba(15,23,42,.10);
}

.path-item {
    color: #2563eb;
    font-weight: 900;
    cursor: pointer;
}

.path-item:hover {
    text-decoration: underline;
}

.path-arrow {
    color: #64748b;
    font-weight: 900;
    padding: 0 5px;
}


/* BACK */

.back-button {
    display: none;
    border: none;
    background: #2563eb;
    color: white;
    padding: 11px 18px;
    border-radius: 9px;
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 12px;
    cursor: pointer;
}

.back-button:hover {
    background: #1d4ed8;
}


/* BOX AREA */

.folder-area {
    position: relative;
    width: 100%;
    min-height: 430px;
    padding: 5px;
}


/*
   Boxes are positioned freely.
   The default positions are automatically created.
*/

.folder {
    position: absolute;

    width: 210px;
    min-height: 125px;

    background: #dbe7f4;

    border: 2px solid #a9bdd4;

    border-radius: 16px;

    box-shadow:
        0 5px 13px rgba(30,41,59,.14);

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 18px 12px;

    cursor: grab;

    user-select: none;

    touch-action: none;

    transition:
        box-shadow .15s ease,
        transform .15s ease,
        background .15s ease;
}

.folder:hover {
    background: #cfdeef;

    box-shadow:
        0 8px 18px rgba(30,64,175,.18);

    transform: translateY(-2px);
}

.folder.dragging {
    cursor: grabbing;

    transform: scale(.97);

    opacity: .75;

    z-index: 9999;

    box-shadow:
        0 15px 30px rgba(15,23,42,.25);
}


/* FOLDER NAME */

.folder-title {
    color: #2563eb;

    font-size: 20px;

    line-height: 1.35;

    font-weight: 900;

    word-break: break-word;
}


/* SEARCH RESULT */

.result-path {

    font-weight: 700;

    line-height: 1.5;

    }

/* =========================================================

const database = {

};


/* =========================================================

========================================================= */

let currentNode = database;

let currentPath = [];


/* =========================================================

========================================================= */

const content =
    document.getElementById("content");

const pathDisplay =
    document.getElementById("pathDisplay");

const backButton =
    document.getElementById("backButton");

const searchBox =

/* =========================================================
   STORAGE
========================================================= */

const POSITION_KEY =
    "pcb_repair_box_positions_v3";


function getPositions() {

    try {

        return JSON.parse(
            localStorage.getItem(
                POSITION_KEY
            )
        ) || {};

    } catch (error) {

        return {};

    }
}


function savePositions(data) {

    localStorage.setItem(
        POSITION_KEY,
        JSON.stringify(data)
    );
}


function getFolderKey() {

    return currentPath.length
        ? currentPath.join(" / ")
        : "ROOT";
}


/* =========================================================
   DEFAULT POSITION
========================================================= */

function getDefaultPosition(
    index
) {

    const gapX = 225;
    const gapY = 150;

    const column =
        index % 3;

    const row =
        Math.floor(index / 3);

    return {
        x: column * gapX,
        y: row * gapY
    };
}


/* =========================================================
   GET BOX POSITION
========================================================= */

function getPosition(
    folderName,
    index
) {

    const all =
        getPositions();

    const page =
        all[getFolderKey()] || {};

    if (
        page[folderName] &&
        typeof page[folderName].x === "number"
    ) {

        return page[folderName];

    }

    return getDefaultPosition(index);
}


/* =========================================================
   SAVE BOX POSITION
========================================================= */

function savePosition(
    folderName,
    x,
    y
) {

    const all =
        getPositions();

    const key =
        getFolderKey();

    if (!all[key]) {
        all[key] = {};
    }

    all[key][folderName] = {
        x: x,
        y: y
    };

    savePositions(all);
}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   URL
========================================================= */

function encodePath(path) {

    return path.map(function(item) {

        return encodeURIComponent(item);

    }).join("/");

}


function decodePath() {

    const hash =
        window.location.hash;

    if (!hash || hash === "#") {
        return [];
    }

    return hash
        .substring(1)
        .split("/")
        .map(function(item) {
            return decodeURIComponent(item);
        });
}


function setURLPath(path) {

    window.location.hash =
        encodePath(path);

}


/* =========================================================
   REBUILD NODE
========================================================= */

function rebuildFromPath(path) {

    currentNode = database;

    currentPath = [];

    for (
        let i = 0;
        i < path.length;
        i++
    ) {

        const name = path[i];

        if (
            !currentNode ||
            !Object.prototype.hasOwnProperty.call(
                currentNode,
                name
            )
        ) {

            currentNode = database;

            currentPath = [];

            return;

        }

        currentNode =
            currentNode[name];

        currentPath.push(name);

    }

}


/* =========================================================
   TREE
========================================================= */

function updatePath() {

    /*
       ROOT deliberately has no HOME text.
    */

    if (
        currentPath.length === 0
    ) {

        pathDisplay.innerHTML = "";

        pathDisplay.style.display =
            "none";

        return;

    }


    pathDisplay.style.display =
        "block";


    let html = "";


    currentPath.forEach(
        function(name, index) {

            if (index > 0) {

                html += `
                    <span class="path-arrow">
                        →
                    </span>
                `;

            }

            html += `
                <span
                    class="path-item"
                    data-index="${index}">

                    ${escapeHTML(name)}

                </span>
            `;

        }
    );


    pathDisplay.innerHTML =
        html;


    pathDisplay
        .querySelectorAll(".path-item")
        .forEach(function(item) {

            item.addEventListener(
                "click",
                function() {

                    const index =
                        Number(
                            item.dataset.index
                        );

                    setURLPath(
                        currentPath.slice(
                            0,
                            index + 1
                        )
                    );

                }
            );

        });

}


/* =========================================================
   BACK
========================================================= */

function updateBackButton() {

    backButton.style.display =
        currentPath.length
        ? "inline-block"
        : "none";

}


backButton.addEventListener(
    "click",
    function() {

        const parent =
            currentPath.slice(
                0,
                -1
            );

        setURLPath(parent);

    }
);


/* =========================================================
   DRAG BOX
========================================================= */

function enableDragging(
    box,
    folderName,
    startX,
    startY
) {

    let dragging = false;

    let offsetX = 0;
    let offsetY = 0;

    function start(
        clientX,
        clientY
    ) {

        dragging = true;

        box.classList.add(
            "dragging"
        );

        const rect =
            box.getBoundingClientRect();

        offsetX =
            clientX - rect.left;

        offsetY =
            clientY - rect.top;

        box.setPointerCapture?.(
            event.pointerId
        );

    }


    function move(
        clientX,
        clientY
    ) {

        if (!dragging) {
            return;
        }

        const area =
            box.parentElement
                .getBoundingClientRect();

        let x =
            clientX -
            area.left -
            offsetX;

        let y =
            clientY -
            area.top -
            offsetY;


        const maxX =
            Math.max(
                0,
                area.width -
                box.offsetWidth
            );


        x =
            Math.max(
                0,
                Math.min(x, maxX)
            );


        y =
            Math.max(
                0,
                y
            );


        box.style.left =
            x + "px";

        box.style.top =
            y + "px";


        savePosition(
            folderName,
            x,
            y
        );

    }


    function stop() {

        if (!dragging) {
            return;
        }

        dragging = false;

        box.classList.remove(
            "dragging"
        );

    }


    box.addEventListener(
        "pointerdown",
        function(e) {

            if (
                e.pointerType === "mouse" &&
                e.button !== 0
            ) {
                return;
            }

            start(
                e.clientX,
                e.clientY
            );

            box.setPointerCapture(
                e.pointerId
            );

        }
    );


    box.addEventListener(
        "pointermove",
        function(e) {

            move(
                e.clientX,
                e.clientY
            );

        }
    );


    box.addEventListener(
        "pointerup",
        function() {

            stop();

        }
    );


    box.addEventListener(
        "pointercancel",
        function() {

            stop();

        }
    );

}


/* =========================================================
   CREATE BOX
========================================================= */

function createBox(
    name,
    index
) {

    const box =
        document.createElement("div");

    box.className =
        "folder";


    box.dataset.folder =
        name;


    const position =
        getPosition(
            name,
            index
        );


    box.style.left =
        position.x + "px";

    box.style.top =
        position.y + "px";


    box.innerHTML = `

        <div class="folder-title">

            ${escapeHTML(name)}

        </div>

    `;


    let moved = false;

    let downX = 0;
    let downY = 0;


    box.addEventListener(
        "pointerdown",
        function(e) {

            downX =
                e.clientX;

            downY =
                e.clientY;

            moved = false;

        }
    );


    box.addEventListener(
        "pointermove",
        function(e) {

            if (
                Math.abs(
                    e.clientX - downX
                ) > 6 ||
                Math.abs(
                    e.clientY - downY
                ) > 6
            ) {

                moved = true;

            }

        }
    );


    box.addEventListener(
        "click",
        function() {

            if (moved) {

                moved = false;

                return;

            }

            openFolder(name);

        }
    );


    enableDragging(
        box,
        name,
        position.x,
        position.y
    );


    return box;

}


/* =========================================================
   SHOW FOLDER
========================================================= */

function showCurrentFolder() {

    content.innerHTML = "";

    updatePath();

    updateBackButton();


    const names =
        Object.keys(
            currentNode
        );


    if (!names.length) {

        content.innerHTML = `

            <div class="file-placeholder">

                This folder is currently empty.

            </div>

        `;

        return;

    }


    const area =
        document.createElement("div");


    area.className =
        "folder-area";


    const rows =
        Math.ceil(
            names.length / 3
        );


    area.style.minHeight =
        Math.max(
            430,
            rows * 150 + 30
        ) + "px";


    names.forEach(
        function(name, index) {

            area.appendChild(
                createBox(
                    name,
                    index
                )
            );

        }
    );


    content.appendChild(
        area
    );

}


/* =========================================================
   OPEN
========================================================= */

function openFolder(name) {

    setURLPath(
        currentPath.concat(name)
    );

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   SEARCH
========================================================= */

function searchTree(
    node,
    path,
    text,
    results
) {

    if (
        !node ||
        typeof node !== "object"
    ) {
        return;
    }


    Object.keys(node).forEach(
        function(name) {

            const newPath =
                path.concat(name);


            if (
                name
                    .toLowerCase()
                    .includes(text)
            ) {

                results.push({
                    name: name,
                    path: newPath
                });

            }


            searchTree(
                node[name],
                newPath,
                text,
                results
            );

        }
    );

}


function performSearch(text) {

    text =
        text.trim().toLowerCase();


    if (!text) {

        showCurrentFolder();

        return;

    }


    const results = [];


    searchTree(
        database,
        [],
        text,
        results
    );


    content.innerHTML = "";


    pathDisplay.style.display =
        "block";


    pathDisplay.innerHTML = `

        <span class="path-item">

            Search Results

        </span>

    `;


    if (!results.length) {

        content.innerHTML = `

            <div class="no-results">

                No matching folder found.

            </div>

        `;

        return;

    }


    const area =
        document.createElement("div");


    area.className =
        "folder-area";


    area.style.minHeight =
        Math.max(
            430,
            Math.ceil(results.length / 3)
            * 150 + 30
        ) + "px";


    results.forEach(
        function(result, index) {

            const box =
                createBox(
                    result.name,
                    index
                );


            box.innerHTML = `

                <div>

                    <div class="folder-title">

                        ${escapeHTML(
                            result.name
                        )}

                    </div>

                    <div class="result-path">

                        ${escapeHTML(
                            result.path.join(
                                " → "
                            )
                        )}

                    </div>

                </div>

            `;


            box.addEventListener(
                "click",
                function() {

                    setURLPath(
                        result.path
                    );

                    searchBox.value =
                        "";

                }
            );


            area.appendChild(
                box
            );

        }
    );


    content.appendChild(
        area
    );

}


/* =========================================================
   SEARCH EVENT
========================================================= */

searchBox.addEventListener(
    "input",
    function() {

        performSearch(
            this.value
        );

    }
);


/* =========================================================
   HASH CHANGE
========================================================= */

window.addEventListener(
    "hashchange",
    function() {

        const path =
            decodePath();

        rebuildFromPath(
            path
        );

        searchBox.value =
            "";

        showCurrentFolder();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }
);


/* =========================================================
   START
========================================================= */

const initialPath =
    decodePath();


rebuildFromPath(
    initialPath
);


showCurrentFolder();

</script>

</body>
</html>
