<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PCB REPAIR DATA</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    color: #222;
}

header {
    background: #1f2937;
    color: white;
    padding: 22px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 8px 0 0;
    font-size: 16px;
}

.search-area {
    background: white;
    padding: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
}

.search-box {
    width: 95%;
    max-width: 650px;
    display: block;
    margin: auto;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

.path {
    background: white;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 14px;
    color: #555;
    word-break: break-word;
}

.back-button {
    display: none;
    border: none;
    background: #2563eb;
    color: white;
    padding: 11px 16px;
    border-radius: 7px;
    font-size: 15px;
    margin-bottom: 12px;
    cursor: pointer;
}

.folder {
    background: white;
    margin: 10px 0;
    padding: 18px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.09);
    cursor: pointer;
}

.folder:active {
    transform: scale(.99);
}

.folder-title {
    font-size: 18px;
    font-weight: bold;
}

.file-placeholder {
    background: white;
    padding: 25px;
    text-align: center;
    border-radius: 10px;
    color: #777;
}

.result {
    background: white;
    padding: 16px;
    margin: 10px 0;
    border-radius: 9px;
    box-shadow: 0 2px 5px rgba(0,0,0,.08);
    cursor: pointer;
}

.result-title {
    font-weight: bold;
    font-size: 16px;
}

.result-path {
    margin-top: 6px;
    font-size: 13px;
    color: #666;
}

.no-results {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
    color: #777;
}

footer {
    text-align: center;
    padding: 30px 15px;
    color: #777;
    font-size: 14px;
}

</style>

</head>


<body>


<header>

<h1>PCB REPAIR DATA</h1>

<p>PCB REPAIR DATABASE</p>

</header>


<div class="search-area">

<input
    id="searchBox"
    class="search-box"
    type="search"
    placeholder="Search anywhere: IC, error code, brand, model..."
    autocomplete="off">

</div>


<div class="container">


<button
    id="backButton"
    class="back-button"
    onclick="goBack()">

← Back

</button>


<div
    id="pathDisplay"
    class="path">

📁 Home

</div>


<div id="content"></div>


</div>


<footer>

PCB REPAIR DATABASE

</footer>



<script>


/* =========================================================
   BRAND LIST
========================================================= */

const brands = [

    "LG",
    "Samsung",
    "Whirlpool",
    "Godrej",
    "Blue Star",
    "IFB",
    "Voltas",
    "Hitachi",
    "Haier",
    "Daikin",
    "Panasonic",
    "Videocon",
    "Mitsubishi HD",
    "Mitsubishi Electric",
    "O General",
    "Lloyd",
    "Sharp",
    "Toshiba",
    "Carrier",
    "Reconnect / Amstard / Amazon Basics"

];


/* =========================================================
   CREATE BRAND FOLDERS
   Each brand has its own Inverter / Non Inverter
========================================================= */

function createBrandFoldersWithTypes() {

    const result = {};

    brands.forEach(function(brand) {

        result[brand] = {

            "Inverter": {},

            "Non Inverter": {}

        };

    });

    return result;

}


/* =========================================================
   CREATE BRAND FOLDERS WITHOUT EXTRA LEVEL
   Used by Photos and Videos
========================================================= */

function createBrandFolders() {

    const result = {};

    brands.forEach(function(brand) {

        result[brand] = {};

    });

    return result;

}


/* =========================================================
   PHOTOS
========================================================= */

const photos = {

    "AC": createBrandFolders(),

    "Fridge": createBrandFolders(),

    "Washing Machine": createBrandFolders(),

    "Microwave Oven": {},

    "Induction": {},

    "RO": {},

    "Chimney": {},

    "Misc": {}

};


/* =========================================================
   VIDEOS
========================================================= */

const videos = {

    "AC": createBrandFolders(),

    "Fridge": createBrandFolders(),

    "Washing Machine": createBrandFolders(),

    "Microwave Oven": {},

    "Induction": {},

    "RO": {},

    "Chimney": {},

    "Misc": {}

};


/* =========================================================
   ERROR CODES
   Every brand:
   Inverter
   Non Inverter
========================================================= */

const errorCodes = createBrandFoldersWithTypes();


/* =========================================================
   SOFTWARE DATA
========================================================= */

const softwareData = {

    "EEPROM Data": {

        "AC": {

            "Inverter Indoor PCB": {},

            "Non Inverter Indoor PCB": {},

            "Inverter ODU PCB": {},

            "Non Inverter ODU PCB": {}

        },


        "Fridge": {

            "Single Door": {

                "Inverter": {},

                "Non Inverter": {}

            },

            "Double Door": {

                "Inverter": {},

                "Non Inverter": {}

            },

            "Triple Door": {

                "Inverter": {},

                "Non Inverter": {}

            },

            "Side by Side": {

                "Inverter": {},

                "Non Inverter": {}

            },

            "Fridge Signal Card": {},

            "Fridge Inverter Card": {}

        },


        "Washing Machine": {

            "Inverter Top Load": {},

            "Inverter Front Load": {},

            "Non Inverter Top Load": {},

            "Non Inverter Front Load": {}

        }

    },


    "MCU Data": {}

};


/* =========================================================
   CIRCUIT DIAGRAMS
========================================================= */

const circuitDiagrams = {

    "AC": {

        "Inverter": {},

        "Non Inverter": {}

    },


    "Fridge": {

        "Inverter": {},

        "Non Inverter": {}

    },


    "Washing Machine": {

        "Inverter": {},

        "Non Inverter": {}

    },


    "Microwave Oven": {

        "Inverter": {},

        "Non Inverter": {}

    },


    "Induction Cooktop": {},

    "Chimney": {},

    "R O": {}

};


/* =========================================================
   PCB TEST POINTS
========================================================= */

const pcbTestPoints = {

    "AC": {

        "Inverter": {},

        "Non Inverter": {}

    },


    "Fridge": {

        "Inverter": {},

        "Non Inverter": {}

    },


    "Washing Machine": {

        "Inverter": {},

        "Non Inverter": {}

    }

};


/* =========================================================
   FRIDGE
========================================================= */

const fridge = {

    "Circuit Diagrams": {},

    "EEPROM BIN Files": {},

    "Error Codes": {},

    "Inverter PCB": {},

    "Photos": {},

    "Sensor Details": {},

    "Signal PCB": {},

    "Videos": {},

    "Wiring Details": {}

};


/* =========================================================
   MICROWAVE OVEN
========================================================= */

const microwaveOven = {

    "MW Oven Touch": {},

    "MW Oven Wiring": {}

};


/* =========================================================
   WASHING MACHINE
========================================================= */

const washingMachine = {

    "Inverter Top Load": {},

    "Inverter Front Load": {},

    "Non Inverter Top Load": {},

    "Non Inverter Front Load": {}

};


/* =========================================================
   COMPLETE MAIN FOLDER STRUCTURE
   MAIN FOLDER SEQUENCE AS REQUESTED
========================================================= */

const database = {

    /* 1 */
    "AC": {

        "Circuit Diagrams": {},

        "EEPROM BIN Files": {},

        "Error Codes": {},

        "Inverter AC": {},

        "Non Inverter AC": {},

        "PDF": {},

        "Photos": {},

        "Remote Photos": {},

        "Sensor Details": {},

        "Test Points": {}

    },


    /* 2 */
    "Fridge": fridge,


    /* 3 */
    "Washing Machine": washingMachine,


    /* 4 */
    "Microwave Oven": microwaveOven,


    /* 5 */
    "Induction Cooktop": {},


    /* 6 */
    "Chimney PCB": {},


    /* 7 */
    "R O PCB": {},


    /* Remaining folders */

    /* 8 */
    "Circuit Diagrams": circuitDiagrams,


    /* 9 */
    "Electronic Components": {},


    /* 10 */
    "Error Codes": errorCodes,


    /* 11 */
    "PCB Test Points": pcbTestPoints,


    /* 12 */
    "PDF": {},


    /* 13 */
    "Photos": photos,


    /* 14 */
    "Software Data": softwareData,


    /* 15 */
    "Videos": videos

};


/* =========================================================
   CURRENT LOCATION
========================================================= */

let currentNode = database;

let currentPath = [];


/* =========================================================
   ELEMENTS
========================================================= */

const content =
    document.getElementById("content");

const backButton =
    document.getElementById("backButton");

const pathDisplay =
    document.getElementById("pathDisplay");

const searchBox =
    document.getElementById("searchBox");


/* =========================================================
   CHECK OBJECT
========================================================= */

function isObject(value) {

    return value !== null &&
           typeof value === "object";

}


/* =========================================================
   DISPLAY CURRENT FOLDER
========================================================= */

function displayCurrentFolder() {

    content.innerHTML = "";


    pathDisplay.innerHTML =
        "📁 " +
        (
            currentPath.length
            ? currentPath.join(" → ")
            : "Home"
        );


    if (currentPath.length === 0) {

        backButton.style.display = "none";

    } else {

        backButton.style.display = "inline-block";

    }


    const keys =
        Object.keys(currentNode);


    if (keys.length === 0) {

        content.innerHTML = `

        <div class="file-placeholder">

            📂 This folder is currently empty.

        </div>

        `;

        return;

    }


    keys.forEach(function(name) {

        createFolderElement(
            name,
            currentNode[name]
        );

    });

}


/* =========================================================
   CREATE FOLDER
   NO "TAP TO OPEN"
========================================================= */

function createFolderElement(name, node) {

    const folder =
        document.createElement("div");

    folder.className = "folder";


    folder.innerHTML = `

        <div class="folder-title">

            📁 ${escapeHTML(name)}

        </div>

    `;


    folder.onclick = function() {

        currentNode = node;

        currentPath.push(name);

        displayCurrentFolder();

    };


    content.appendChild(folder);

}


/* =========================================================
   BACK
========================================================= */

function goBack() {

    if (currentPath.length === 0) {

        return;

    }


    currentPath.pop();


    currentNode = database;


    for (
        let i = 0;
        i < currentPath.length;
        i++
    ) {

        currentNode =
            currentNode[currentPath[i]];

    }


    displayCurrentFolder();

}


/* =========================================================
   GLOBAL SEARCH
========================================================= */

function searchDatabase(
    node,
    path,
    searchText,
    results
) {

    Object.keys(node).forEach(function(name) {

        const fullPath =
            path.concat(name);


        const nameMatch =
            name.toLowerCase()
            .includes(searchText);


        if (nameMatch) {

            results.push({

                name: name,

                path: fullPath

            });

        }


        if (isObject(node[name])) {

            searchDatabase(
                node[name],
                fullPath,
                searchText,
                results
            );

        }

    });

}


/* =========================================================
   DISPLAY SEARCH RESULTS
========================================================= */

function performSearch(text) {

    text =
        text.trim().toLowerCase();


    if (!text) {

        displayCurrentFolder();

        return;

    }


    const results = [];


    searchDatabase(
        database,
        [],
        text,
        results
    );


    content.innerHTML = "";


    pathDisplay.innerHTML =
        "🔎 Search Results";


    backButton.style.display =
        "inline-block";


    if (results.length === 0) {

        content.innerHTML = `

        <div class="no-results">

            No matching folder found.

        </div>

        `;

        return;

    }


    const heading =
        document.createElement("div");


    heading.style.marginBottom =
        "10px";


    heading.innerHTML =
        "<b>" +
        results.length +
        "</b> result(s) found";


    content.appendChild(heading);


    results.forEach(function(result) {

        const div =
            document.createElement("div");


        div.className = "result";


        div.innerHTML = `

            <div class="result-title">

                📁 ${escapeHTML(result.name)}

            </div>

            <div class="result-path">

                ${escapeHTML(
                    result.path.join(" → ")
                )}

            </div>

        `;


        div.onclick = function() {

            openSearchResult(
                result.path
            );

        };


        content.appendChild(div);

    });

}


/* =========================================================
   OPEN SEARCH RESULT
========================================================= */

function openSearchResult(path) {

    currentNode = database;

    currentPath = [];


    for (
        let i = 0;
        i < path.length;
        i++
    ) {

        currentNode =
            currentNode[path[i]];

        currentPath.push(
            path[i]
        );

    }


    searchBox.value = "";

    displayCurrentFolder();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return text

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================================================
   SEARCH EVENT
========================================================= */

searchBox.addEventListener(
    "input",
    function() {

        performSearch(
            this.value
        );

    }
);


/* =========================================================
   START
========================================================= */

displayCurrentFolder();


</script>

</body>

</html>
