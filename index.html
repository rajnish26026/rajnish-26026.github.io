<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PCB REPAIR DATA</title>

<style>

/* =========================================================
   BASIC
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef4fb;
    color: #26364a;
}


/* =========================================================
   HEADER
========================================================= */

header {
    background: linear-gradient(135deg, #123b67, #1769aa);
    color: white;
    padding: 22px 15px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,.15);
}

header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: .5px;
}

header p {
    margin: 8px 0 0;
    font-size: 15px;
    font-weight: 700;
    opacity: .95;
}


/* =========================================================
   SEARCH
========================================================= */

.search-area {
    background: white;
    padding: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.10);
}

.search-box {
    width: 95%;
    max-width: 700px;
    display: block;
    margin: auto;

    padding: 14px 17px;

    border: 2px solid #cbd8e8;
    border-radius: 12px;

    font-size: 16px;
    font-weight: 600;

    color: #23415f;
    background: #f8fbff;

    outline: none;
}

.search-box:focus {
    border-color: #2384d9;
    background: white;
    box-shadow: 0 0 0 3px rgba(35,132,217,.12);
}


/* =========================================================
   MAIN
========================================================= */

.container {
    max-width: 1100px;
    margin: auto;
    padding: 16px;
}


/* =========================================================
   CLICKABLE TREE / BREADCRUMB
========================================================= */

.path {
    background: linear-gradient(135deg, #e5f2ff, #f3f9ff);

    border-left: 6px solid #2384d9;

    padding: 14px 16px;

    border-radius: 10px;

    margin-bottom: 14px;

    font-size: 16px;
    font-weight: 900;

    color: #174a7a;

    line-height: 1.8;

    word-break: break-word;

    box-shadow: 0 3px 9px rgba(24,78,125,.10);
}


/* HOME / TREE ITEMS */

.path-home {
    color: #1769aa;
    font-weight: 900;
    cursor: pointer;
}

.path-home:hover {
    color: #0b4e87;
    text-decoration: underline;
}

.path-item {
    color: #2878b9;
    font-weight: 900;
    cursor: pointer;
}

.path-item:hover {
    color: #0b5b98;
    text-decoration: underline;
}

.path-arrow {
    color: #6b9bc4;
    font-weight: 900;
    padding: 0 5px;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-button {
    display: none;

    border: none;

    background: linear-gradient(135deg, #287dcc, #1769aa);

    color: white;

    padding: 11px 19px;

    border-radius: 9px;

    font-size: 16px;
    font-weight: 800;

    margin-bottom: 13px;

    cursor: pointer;

    box-shadow: 0 3px 8px rgba(23,105,170,.25);
}

.back-button:hover {
    background: linear-gradient(135deg, #1769aa, #0f568e);
}

.back-button:active {
    transform: scale(.97);
}


/* =========================================================
   FOLDER GRID
========================================================= */

#content {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 14px;
}


/* =========================================================
   PROFESSIONAL FOLDER BOX
========================================================= */

.folder {
    min-height: 105px;

    background: linear-gradient(
        145deg,
        #ffffff,
        #edf7ff
    );

    border: 2px solid #b9d7ee;

    border-radius: 14px;

    padding: 20px 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    cursor: pointer;

    position: relative;

    box-shadow:
        0 4px 10px rgba(35,99,145,.10);

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        border-color .15s ease,
        background .15s ease;

    user-select: none;

    touch-action: manipulation;
}


/* hover */

.folder:hover {
    border-color: #4c9bd2;

    background: linear-gradient(
        145deg,
        #ffffff,
        #e3f3ff
    );

    box-shadow:
        0 7px 18px rgba(35,110,170,.18);

    transform: translateY(-2px);
}


/* click */

.folder:active {
    transform: scale(.97);
}


/* =========================================================
   FOLDER TEXT
========================================================= */

.folder-title {
    font-size: 18px;

    line-height: 1.35;

    font-weight: 900;

    color: #1769aa;

    word-break: normal;

    overflow-wrap: anywhere;
}


/*
   SPECIAL COLOUR CLASSES
*/

.folder:nth-child(4n+1) .folder-title {
    color: #1769aa;
}

.folder:nth-child(4n+2) .folder-title {
    color: #287a56;
}

.folder:nth-child(4n+3) .folder-title {
    color: #8a5a12;
}

.folder:nth-child(4n+4) .folder-title {
    color: #7651a8;
}


/* =========================================================
   DRAG HANDLE
========================================================= */

.drag-handle {
    position: absolute;

    top: 7px;
    right: 9px;

    font-size: 13px;

    color: #8aabc3;

    cursor: grab;

    opacity: .75;
}

.folder:active .drag-handle {
    cursor: grabbing;
}


/* =========================================================
   DRAGGING
========================================================= */

.folder.dragging {
    opacity: .45;

    border-color: #2384d9;

    transform: scale(.97);
}


/* =========================================================
   DROP TARGET
========================================================= */

.folder.drag-over {
    border-color: #1769aa;

    box-shadow:
        0 0 0 3px rgba(35,132,217,.18);
}


/* =========================================================
   EMPTY / SEARCH
========================================================= */

.file-placeholder,
.no-results {
    grid-column: 1 / -1;

    background: white;

    padding: 35px 20px;

    text-align: center;

    border-radius: 12px;

    color: #58718a;

    font-weight: 700;

    border: 2px solid #d5e3ef;
}


/* =========================================================
   SEARCH RESULT PATH
========================================================= */

.result-path {
    margin-top: 8px;

    font-size: 13px;

    font-weight: 700;

    color: #5b7892;

    line-height: 1.5;
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    text-align: center;

    padding: 30px 15px;

    color: #688198;

    font-size: 14px;

    font-weight: 700;
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 850px) {

    #content {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));
    }

}


/* =========================================================
   MOBILE
   3 BOXES IN ONE ROW
========================================================= */

@media (max-width: 600px) {

    header h1 {
        font-size: 24px;
    }

    header p {
        font-size: 13px;
    }

    .container {
        padding: 11px;
    }

    .path {
        font-size: 14px;
        padding: 12px;
    }

    #content {

        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        gap: 8px;
    }

    .folder {

        min-height: 105px;

        padding: 15px 7px;

        border-radius: 12px;
    }

    .folder-title {

        font-size: 15px;

        line-height: 1.3;
    }

    .drag-handle {

        font-size: 11px;

        top: 5px;
        right: 6px;
    }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 380px) {

    #content {
        gap: 6px;
    }

    .folder {
        min-height: 100px;
        padding: 13px 5px;
    }

    .folder-title {
        font-size: 14px;
    }

}

</style>

/* =========================================================
   APP STATE
========================================================= */

let currentNode = database;

let currentPath = [];


/* =========================================================
   ELEMENTS
========================================================= */

const content =
    document.getElementById("content");

const pathDisplay =
    document.getElementById("pathDisplay");

const backButton =
    document.getElementById("backButton");

const searchBox =
    document.getElementById("searchBox");


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   URL PATH
========================================================= */

function encodePath(path) {

    return path
        .map(function(item) {

            return encodeURIComponent(item);

        })
        .join("/");

}


function decodePath() {

    const hash =
        window.location.hash;

    if (!hash || hash === "#") {
        return [];
    }

    const raw =
        hash.substring(1);

    if (!raw) {
        return [];
    }

    return raw
        .split("/")
        .map(function(item) {

            return decodeURIComponent(item);

        });

}


function setURLPath(path) {

    const newHash =
        encodePath(path);

    if (
        window.location.hash.substring(1)
        === newHash
    ) {
        return;
    }

    window.location.hash =
        newHash;

}


/* =========================================================
   REBUILD NODE
========================================================= */

function rebuildFromPath(path) {

    currentNode =
        database;

    currentPath = [];


    for (
        let i = 0;
        i < path.length;
        i++
    ) {

        const name =
            path[i];

        if (
            !currentNode ||
            !Object.prototype.hasOwnProperty.call(
                currentNode,
                name
            )
        ) {

            currentNode =
                database;

            currentPath = [];

            return;

        }

        currentNode =
            currentNode[name];

        currentPath.push(name);

    }

}


/* =========================================================
   TREE / BREADCRUMB
   EVERY ITEM IS CLICKABLE
========================================================= */

function updatePath() {

    pathDisplay.innerHTML = "";


    const home =
        document.createElement("span");

    home.className =
        "path-home";

    home.textContent =
        "Home";

    home.addEventListener(
        "click",
        function() {

            setURLPath([]);

        }
    );

    pathDisplay.appendChild(home);


    currentPath.forEach(
        function(name, index) {

            const arrow =
                document.createElement("span");

            arrow.className =
                "path-arrow";

            arrow.textContent =
                "→";

            pathDisplay.appendChild(
                arrow
            );


            const item =
                document.createElement("span");

            item.className =
                "path-item";

            item.textContent =
                name;


            /*
               Touch/click any tree name
               to directly go to that level.
            */

            item.addEventListener(
                "click",
                function() {

                    const targetPath =
                        currentPath.slice(
                            0,
                            index + 1
                        );

                    setURLPath(
                        targetPath
                    );

                }
            );


            pathDisplay.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   BACK BUTTON
========================================================= */

function updateBackButton() {

    backButton.style.display =
        currentPath.length === 0
        ? "none"
        : "inline-block";

}


backButton.addEventListener(
    "click",
    function() {

        if (
            currentPath.length === 0
        ) {
            return;
        }

        const parentPath =
            currentPath.slice(
                0,
                currentPath.length - 1
            );

        setURLPath(
            parentPath
        );

    }
);


/* =========================================================
   SAVED BOX ORDER
========================================================= */

function getOrderKey() {

    return "pcb-folder-order-" +
        currentPath.join("|");

}


function getSavedOrder(names) {

    try {

        const saved =
            JSON.parse(
                localStorage.getItem(
                    getOrderKey()
                )
            );

        if (!Array.isArray(saved)) {
            return names;
        }

        const result = [];

        saved.forEach(function(name) {

            if (
                names.includes(name) &&
                !result.includes(name)
            ) {

                result.push(name);

            }

        });

        names.forEach(function(name) {

            if (!result.includes(name)) {
                result.push(name);
            }

        });

        return result;

    } catch (error) {

        return names;

    }

}


function saveOrder() {

    const names =
        Array.from(
            content.querySelectorAll(".folder")
        ).map(function(folder) {

            return folder.dataset.name;

        });

    localStorage.setItem(

        getOrderKey(),

        JSON.stringify(names)

    );

}


/* =========================================================
   DRAG AND DROP
========================================================= */

let draggedFolder = null;


function enableDragging(folder) {

    folder.draggable = true;


    folder.addEventListener(
        "dragstart",
        function(event) {

            draggedFolder =
                folder;

            folder.classList.add(
                "dragging"
            );

            event.dataTransfer.effectAllowed =
                "move";

        }
    );


    folder.addEventListener(
        "dragend",
        function() {

            folder.classList.remove(
                "dragging"
            );

            document
                .querySelectorAll(".folder")
                .forEach(function(item) {

                    item.classList.remove(
                        "drag-over"
                    );

                });

            draggedFolder = null;

            saveOrder();

        }
    );


    folder.addEventListener(
        "dragover",
        function(event) {

            event.preventDefault();

            if (
                draggedFolder &&
                draggedFolder !== folder
            ) {

                folder.classList.add(
                    "drag-over"
                );

            }

        }
    );


    folder.addEventListener(
        "dragleave",
        function() {

            folder.classList.remove(
                "drag-over"
            );

        }
    );


    folder.addEventListener(
        "drop",
        function(event) {

            event.preventDefault();

            folder.classList.remove(
                "drag-over"
            );


            if (
                !draggedFolder ||
                draggedFolder === folder
            ) {
                return;
            }


            const rect =
                folder.getBoundingClientRect();


            const after =
                event.clientY >
                rect.top +
                rect.height / 2;


            if (after) {

                folder.after(
                    draggedFolder
                );

            } else {

                folder.before(
                    draggedFolder
                );

            }


            saveOrder();

        }
    );

}


/* =========================================================
   SHOW CURRENT FOLDER
========================================================= */

function showCurrentFolder() {

    content.innerHTML = "";

    updatePath();

    updateBackButton();


    let folderNames =
        Object.keys(currentNode);


    folderNames =
        getSavedOrder(folderNames);


    if (
        folderNames.length === 0
    ) {

        const empty =
            document.createElement("div");

        empty.className =
            "file-placeholder";

        empty.textContent =
            "This folder is currently empty.";

        content.appendChild(
            empty
        );

        return;

    }


    folderNames.forEach(
        function(folderName) {

            const folder =
                document.createElement("div");


            folder.className =
                "folder";


            folder.dataset.name =
                folderName;


            folder.innerHTML = `

                <span class="drag-handle"
                      title="Drag to move">

                    ⋮⋮

                </span>

                <div class="folder-title">

                    ${escapeHTML(folderName)}

                </div>

            `;


            folder.addEventListener(
                "click",
                function(event) {

                    /*
                       Ignore click after dragging.
                    */

                    if (
                        draggedFolder
                    ) {
                        return;
                    }


                    openFolder(
                        folderName
                    );

                }
            );


            enableDragging(
                folder
            );


            content.appendChild(
                folder
            );

        }
    );

}


/* =========================================================
   OPEN FOLDER
========================================================= */

function openFolder(folderName) {

    const newPath =
        currentPath.concat(
            folderName
        );

    setURLPath(
        newPath
    );

}


/* =========================================================
   PHONE / BROWSER BACK
========================================================= */

window.addEventListener(
    "hashchange",
    function() {

        const path =
            decodePath();


        rebuildFromPath(
            path
        );


        searchBox.value =
            "";


        showCurrentFolder();


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }
);


/* =========================================================
   SEARCH TREE
========================================================= */

function searchTree(
    node,
    path,
    text,
    results
) {

    if (
        !node ||
        typeof node !== "object"
    ) {
        return;
    }


    Object.keys(node).forEach(
        function(name) {

            const newPath =
                path.concat(name);


            if (
                name
                    .toLowerCase()
                    .includes(text)
            ) {

                results.push({

                    name: name,

                    path: newPath

                });

            }


            if (
                node[name] &&
                typeof node[name] === "object"
            ) {

                searchTree(
                    node[name],
                    newPath,
                    text,
                    results
                );

            }

        }
    );

}


/* =========================================================
   SEARCH
========================================================= */

function performSearch(text) {

    text =
        text.trim().toLowerCase();


    if (!text) {

        showCurrentFolder();

        return;

    }


    const results = [];


    searchTree(
        database,
        [],
        text,
        results
    );


    content.innerHTML = "";


    pathDisplay.innerHTML = `

        <span class="path-item">

            Search Results

        </span>

    `;


    updateBackButton();


    if (
        results.length === 0
    ) {

        const noResult =
            document.createElement("div");

        noResult.className =
            "no-results";

        noResult.textContent =
            "No matching folder found.";

        content.appendChild(
            noResult
        );

        return;

    }


    results.forEach(
        function(result) {

            const item =
                document.createElement("div");


            item.className =
                "folder";


            item.innerHTML = `

                <div>

                    <div class="folder-title">

                        ${escapeHTML(
                            result.name
                        )}

                    </div>

                    <div class="result-path">

                        ${escapeHTML(
                            result.path.join(
                                " → "
                            )
                        )}

                    </div>

                </div>

            `;


            item.addEventListener(
                "click",
                function() {

                    searchBox.value =
                        "";

                    setURLPath(
                        result.path
                    );

                }
            );


            content.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   SEARCH EVENT
========================================================= */

searchBox.addEventListener(
    "input",
    function() {

        performSearch(
            this.value
        );

    }
);


/* =========================================================
   START APPLICATION
========================================================= */

const initialPath =
    decodePath();


rebuildFromPath(
    initialPath
);


showCurrentFolder();

</script>

</body>
</html>
