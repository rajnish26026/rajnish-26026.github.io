* {

.container {
    max-width: 1100px;

/* =========================
   CLICKABLE TREE
========================= */

.path {
    background: #dbeafe;
    border-left: 6px solid #2563eb;
    padding: 14px 15px;
    border-radius: 9px;
    margin-bottom: 14px;
    font-size: 15px;
    font-weight: 900;
    color: #1e3a8a;

    word-break: break-word;
    box-shadow: 0 2px 5px rgba(0,0,0,.08);
}

.path-item {
    display: inline-block;
    font-weight: 900;
    color: #111827;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 6px;
}

.path-item:hover {
    background: #bfdbfe;
    color: #1d4ed8;
}

.path-arrow {
    font-weight: 900;
    color: #2563eb;
    padding: 0 4px;
}

/* =========================
   BACK BUTTON
========================= */

.back-button {
    display: none;
    border: none;
    background: #2563eb;
    color: white;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 12px;
    cursor: pointer;
}

.back-button:active {
    transform: scale(.97);
}

/* =========================
   FOLDER GRID
========================= */

.folder-grid {
    display: grid;
    grid-template-columns:
        repeat(4, minmax(0, 1fr));
    gap: 14px;
}

/* =========================
   FOLDER BOX
========================= */

.folder {
    min-height: 120px;
    padding: 16px 10px;

    border-radius: 15px;
    border: 2px solid #d8e0ea;

    background: linear-gradient(
        145deg,
        #ffffff,
        #f5f8fc
    );

    box-shadow:
        0 5px 14px rgba(15,23,42,.10);

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    transition:
        transform .16s ease,
        box-shadow .16s ease,
        border-color .16s ease;

    overflow-wrap: anywhere;

    touch-action: none;

    position: relative;
}

.folder:hover {
    transform: translateY(-3px);

    border-color: #60a5fa;

    box-shadow:
        0 9px 20px rgba(37,99,235,.16);
}

.folder:active {
    transform: scale(.97);
}

/* =========================
   FOLDER TEXT
========================= */

.folder-title {
    font-size: 19px;
    line-height: 1.18;
    font-weight: 900;
    color: #111827;

    text-transform: uppercase;

    white-space: normal;
    word-break: normal;

    pointer-events: none;
}

/* =========================
   PROFESSIONAL COLORS
========================= */

.folder:nth-child(4n+1) {
    background: linear-gradient(
        145deg,
        #eff6ff,
        #ffffff
    );

    border-color: #bfdbfe;
}

.folder:nth-child(4n+1) .folder-title {
    color: #1d4ed8;
}


.folder:nth-child(4n+2) {
    background: linear-gradient(
        145deg,
        #ecfdf5,
        #ffffff
    );

    border-color: #bbf7d0;
}

.folder:nth-child(4n+2) .folder-title {
    color: #047857;
}


.folder:nth-child(4n+3) {
    background: linear-gradient(
        145deg,
        #fff7ed,
        #ffffff
    );

    border-color: #fed7aa;
}

.folder:nth-child(4n+3) .folder-title {
    color: #c2410c;
}


.folder:nth-child(4n+4) {
    background: linear-gradient(
        145deg,
        #f5f3ff,
        #ffffff
    );

    border-color: #ddd6fe;
}

.folder:nth-child(4n+4) .folder-title {
    color: #6d28d9;
}

/* =========================
   DRAGGING
========================= */

.folder.dragging {
    opacity: .45;
    transform: scale(.96);
    box-shadow:
        0 15px 30px rgba(0,0,0,.20);
}

.folder.drag-over {
    border-color: #2563eb !important;
    box-shadow:
        0 0 0 4px rgba(37,99,235,.18);

/* =========================

========================= */

.result-path {

/* =========================

        }

/* =========================================================
   MAIN DATABASE
========================================================= */

const database = {

        Photos,

    "Software Data":
        SoftwareData,

    "Videos":
        Videos

};


/* =========================================================
   APP STATE
========================================================= */

let currentNode = database;

let currentPath = [];


/* =========================================================
   ELEMENTS
========================================================= */

const content =
    document.getElementById("content");

const pathDisplay =
    document.getElementById("pathDisplay");

const backButton =
    document.getElementById("backButton");

const searchBox =
    document.getElementById("searchBox");


/* =========================================================
   STORAGE
========================================================= */

const ORDER_STORAGE_KEY =
    "pcbRepairFolderOrders_v1";


function getSavedOrders() {

    try {

        return JSON.parse(
            localStorage.getItem(
                ORDER_STORAGE_KEY
            ) || "{}"
        );

    } catch (error) {

        return {};

    }

}


function saveOrders(orders) {

    try {

        localStorage.setItem(
            ORDER_STORAGE_KEY,
            JSON.stringify(orders)
        );

    } catch (error) {

        console.log(
            "Could not save folder order."
        );

    }

}


/* =========================================================
   PATH KEY
========================================================= */

function getOrderKey(path) {

    return path.join("||");

}


/* =========================================================
   GET ORDERED NAMES
========================================================= */

function getOrderedNames(node, path) {

    const names =
        Object.keys(node);

    const orders =
        getSavedOrders();

    const key =
        getOrderKey(path);

    if (
        !orders[key] ||
        !Array.isArray(orders[key])
    ) {

        return names;

    }

    const saved =
        orders[key];

    const ordered = [];


    saved.forEach(function(name) {

        if (
            names.includes(name)
        ) {

            ordered.push(name);

        }

    });


    names.forEach(function(name) {

        if (
            !ordered.includes(name)
        ) {

            ordered.push(name);

        }

    });


    return ordered;

}


/* =========================================================
   SAVE CURRENT ORDER
========================================================= */

function saveCurrentOrder() {

    const boxes =
        Array.from(
            document.querySelectorAll(
                "#content .folder-grid .folder"
            )
        );

    const names =
        boxes.map(function(box) {

            return box.dataset.name;

        });


    const orders =
        getSavedOrders();

    orders[
        getOrderKey(currentPath)
    ] = names;

    saveOrders(orders);

}


/* =========================================================
   ENCODE PATH
========================================================= */

function encodePath(path) {

    return path
        .map(function(item) {

            return encodeURIComponent(item);

        })
        .join("/");

}


/* =========================================================
   DECODE PATH
========================================================= */

function decodePath() {

    const hash =
        window.location.hash;


    if (
        !hash ||
        hash === "#"
    ) {

        return [];

    }


    const raw =
        hash.substring(1);


    if (!raw) {

        return [];

    }


    return raw
        .split("/")
        .map(function(item) {

            return decodeURIComponent(item);

        });

}


/* =========================================================
   CHANGE URL
========================================================= */

function setURLPath(path) {

    const newHash =
        encodePath(path);


    if (
        window.location.hash.substring(1)
        === newHash
    ) {

        return;

    }


    window.location.hash =
        newHash;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================================================
   REBUILD CURRENT NODE
========================================================= */

function rebuildFromPath(path) {

    currentNode =
        database;

    currentPath = [];


    for (
        let i = 0;
        i < path.length;
        i++
    ) {

        const name =
            path[i];


        if (
            !currentNode ||

            !Object.prototype.hasOwnProperty.call(
                currentNode,
                name
            )
        ) {

            currentNode =
                database;

            currentPath = [];

            return;

        }


        currentNode =
            currentNode[name];

        currentPath.push(name);

    }

}


/* =========================================================
   CLICKABLE TREE
========================================================= */

function updatePath() {

    if (
        currentPath.length === 0
    ) {

        pathDisplay.innerHTML = "";

        return;

    }


    let html = "";


    currentPath.forEach(function(name, index) {

        if (index > 0) {

            html += `
                <span class="path-arrow">→</span>
            `;

        }


        html += `

            <span
                class="path-item"
                data-path-index="${index}">

                ${escapeHTML(name)}

            </span>

        `;

    });


    pathDisplay.innerHTML =
        html;


    document
        .querySelectorAll(".path-item")
        .forEach(function(item) {

            item.addEventListener(
                "click",
                function() {

                    const index =
                        Number(
                            this.dataset.pathIndex
                        );


                    const targetPath =
                        currentPath.slice(
                            0,
                            index + 1
                        );


                    setURLPath(
                        targetPath
                    );

                }
            );

        });

}


/* =========================================================
   BACK BUTTON
========================================================= */

function updateBackButton() {

    if (
        currentPath.length === 0
    ) {

        backButton.style.display =
            "none";

    } else {

        backButton.style.display =
            "inline-block";

    }

}


backButton.addEventListener(
    "click",
    function() {

        if (
            currentPath.length === 0
        ) {

            return;

        }


        const parentPath =
            currentPath.slice(
                0,
                currentPath.length - 1
            );


        setURLPath(
            parentPath
        );

    }
);


/* =========================================================
   DRAG AND DROP
   MOBILE + DESKTOP
========================================================= */

let draggedFolder = null;

let dragStartX = 0;
let dragStartY = 0;

let isDragging = false;
let holdTimer = null;


function clearDragState() {

    if (holdTimer) {

        clearTimeout(
            holdTimer
        );

        holdTimer = null;

    }


    document
        .querySelectorAll(".folder")
        .forEach(function(folder) {

            folder.classList.remove(
                "dragging"
            );

            folder.classList.remove(
                "drag-over"
            );

        });


    draggedFolder = null;
    isDragging = false;

}


function getFolderFromPoint(x, y) {

    const element =
        document.elementFromPoint(
            x,
            y
        );


    if (!element) {

        return null;

    }


    return element.closest(
        ".folder"
    );

}


function moveDraggedFolder(x, y) {

    if (!draggedFolder) {

        return;

    }


    const target =
        getFolderFromPoint(
            x,
            y
        );


    document
        .querySelectorAll(".folder")
        .forEach(function(folder) {

            folder.classList.remove(
                "drag-over"
            );

        });


    if (
        !target ||
        target === draggedFolder
    ) {

        return;

    }


    target.classList.add(
        "drag-over"
    );


    const rect =
        target.getBoundingClientRect();


    const middle =
        rect.left +
        rect.width / 2;


    if (x < middle) {

        target.parentNode.insertBefore(
            draggedFolder,
            target
        );

    } else {

        target.parentNode.insertBefore(
            draggedFolder,
            target.nextSibling
        );

    }

}


function finishDrag() {

    if (!isDragging) {

        return;

    }


    saveCurrentOrder();

    clearDragState();

}


function startDrag(folder, event) {

    draggedFolder =
        folder;

    isDragging =
        true;

    folder.classList.add(
        "dragging"
    );


    if (
        event &&
        event.pointerId !== undefined
    ) {

        try {

            folder.setPointerCapture(
                event.pointerId
            );

        } catch (error) {}

    }

}


function setupDrag(folder) {

    folder.addEventListener(
        "pointerdown",
        function(event) {

            if (
                event.button !== undefined &&
                event.button !== 0
            ) {

                return;

            }


            dragStartX =
                event.clientX;

            dragStartY =
                event.clientY;


            isDragging =
                false;


            holdTimer =
                setTimeout(
                    function() {

                        startDrag(
                            folder,
                            event
                        );

                    },
                    350
                );

        }
    );


    folder.addEventListener(
        "pointermove",
        function(event) {

            const dx =
                Math.abs(
                    event.clientX -
                    dragStartX
                );

            const dy =
                Math.abs(
                    event.clientY -
                    dragStartY
                );


            if (
                !isDragging &&
                (dx > 12 || dy > 12)
            ) {

                if (holdTimer) {

                    clearTimeout(
                        holdTimer
                    );

                    holdTimer = null;

                }

            }


            if (isDragging) {

                event.preventDefault();

                moveDraggedFolder(
                    event.clientX,
                    event.clientY
                );

            }

        }
    );


    folder.addEventListener(
        "pointerup",
        function(event) {

            if (isDragging) {

                event.preventDefault();

                finishDrag();

                return;

            }


            if (holdTimer) {

                clearTimeout(
                    holdTimer
                );

                holdTimer = null;

            }

            /* Normal tap opens folder */

            openFolder(
                folder.dataset.name
            );

        }
    );


    folder.addEventListener(
        "pointercancel",
        function() {

            clearDragState();

        }
    );

}


/* =========================================================
   SHOW CURRENT FOLDER
========================================================= */

function showCurrentFolder() {

    content.innerHTML = "";


    updatePath();

    updateBackButton();


    const folderNames =
        getOrderedNames(
            currentNode,
            currentPath
        );


    if (
        folderNames.length === 0
    ) {

        content.innerHTML = `

            <div class="file-placeholder">

                This folder is currently empty.

            </div>

        `;

        return;

    }


    const grid =
        document.createElement("div");


    grid.className =
        "folder-grid";


    folderNames.forEach(function(folderName) {

        const folder =
            document.createElement("div");


        folder.className =
            "folder";


        folder.dataset.name =
            folderName;


        folder.innerHTML = `

            <div class="folder-title">

                ${escapeHTML(folderName)}

            </div>

        `;


        setupDrag(folder);


        grid.appendChild(folder);

    });


    content.appendChild(
        grid
    );

}


/* =========================================================
   OPEN FOLDER
========================================================= */

function openFolder(folderName) {

    const newPath =
        currentPath.concat(
            folderName
        );


    setURLPath(
        newPath
    );

}


/* =========================================================
   PHONE / BROWSER BACK
========================================================= */

window.addEventListener(
    "hashchange",
    function() {

        const path =
            decodePath();


        rebuildFromPath(
            path
        );


        searchBox.value =
            "";


        showCurrentFolder();


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }
);


/* =========================================================
   SEARCH TREE
========================================================= */

function searchTree(
    node,
    path,
    text,
    results
) {

    if (
        !node ||
        typeof node !== "object"
    ) {

        return;

    }


    Object.keys(node).forEach(
        function(name) {

            const newPath =
                path.concat(name);


            if (
                name
                    .toLowerCase()
                    .includes(text)
            ) {

                results.push({

                    name: name,

                    path: newPath

                });

            }


            if (
                node[name] &&
                typeof node[name] === "object"
            ) {

                searchTree(

                    node[name],

                    newPath,

                    text,

                    results

                );

            }

        }
    );

}


/* =========================================================
   SEARCH
========================================================= */

function performSearch(text) {

    text =
        text.trim().toLowerCase();


    if (!text) {

        showCurrentFolder();

        return;

    }


    const results = [];


    searchTree(

        database,

        [],

        text,

        results

    );


    content.innerHTML = "";


    pathDisplay.innerHTML = `

        <span class="path-item">

            Search Results

        </span>

    `;


    updateBackButton();


    if (
        results.length === 0
    ) {

        content.innerHTML = `

            <div class="no-results">

                No matching folder found.

            </div>

        `;

        return;

    }


    const grid =
        document.createElement("div");


    grid.className =
        "folder-grid";


    results.forEach(
        function(result) {

            const item =
                document.createElement("div");


            item.className =
                "folder";


            item.innerHTML = `

                <div>

                    <div class="folder-title">

                        ${escapeHTML(
                            result.name
                        )}

                    </div>

                    <div class="result-path">

                        ${escapeHTML(
                            result.path.join(
                                " → "
                            )
                        )}

                    </div>

                </div>

            `;


            item.addEventListener(
                "click",
                function() {

                    setURLPath(
                        result.path
                    );


                    searchBox.value =
                        "";

                }
            );


            grid.appendChild(
                item
            );

        }
    );


    content.appendChild(
        grid
    );

}


/* =========================================================
   SEARCH EVENT
========================================================= */

searchBox.addEventListener(
    "input",
    function() {

        performSearch(
            this.value
        );

    }
);


/* =========================================================
   START APPLICATION
========================================================= */

const initialPath =
    decodePath();


rebuildFromPath(
    initialPath
);


showCurrentFolder();

</script>
