<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PCB REPAIR DATA</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
    color: #1f2937;
}


/* HEADER */

header {
    background: #1f2937;
    color: white;
    padding: 22px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 800;
}

header p {
    margin: 8px 0 0;
    font-size: 16px;
    font-weight: 700;
}


/* SEARCH */

.search-area {
    background: white;
    padding: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 7px rgba(0,0,0,.10);
}

.search-box {
    width: 95%;
    max-width: 700px;
    display: block;
    margin: auto;
    padding: 14px 16px;
    border: 2px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

.search-box:focus {
    border-color: #2563eb;
}


/* MAIN */

.container {
    max-width: 950px;
    margin: auto;
    padding: 15px;
}


/* TREE */

.path {
    background: #dbeafe;
    border-left: 6px solid #2563eb;
    padding: 14px 15px;
    border-radius: 9px;
    margin-bottom: 14px;

    font-size: 15px;
    font-weight: 900;

    color: #1e3a8a;
    line-height: 1.7;

    word-break: break-word;

    box-shadow: 0 2px 5px rgba(0,0,0,.08);
}

.path-home {
    font-weight: 900;
    color: #1d4ed8;
}

.path-item {
    font-weight: 900;
    color: #111827;
}

.path-arrow {
    font-weight: 900;
    color: #2563eb;
    padding: 0 5px;
}


/* BACK */

.back-button {
    display: none;

    border: none;

    background: #2563eb;
    color: white;

    padding: 11px 18px;

    border-radius: 8px;

    font-size: 16px;
    font-weight: 800;

    margin-bottom: 12px;

    cursor: pointer;
}

.back-button:active {
    transform: scale(.97);
}


/* FOLDERS */

.folder {
    background: white;

    margin: 11px 0;
    padding: 19px 18px;

    border-radius: 11px;

    border: 2px solid #dbe3ee;

    box-shadow: 0 3px 8px rgba(0,0,0,.08);

    cursor: pointer;

    transition: .15s ease;
}

.folder:hover {
    border-color: #93c5fd;
}

.folder:active {
    transform: scale(.985);
}

.folder-title {
    font-size: 18px;
    font-weight: 900;
    color: #111827;
}


/* SEARCH PATH */

.result-path {
    margin-top: 7px;
    font-size: 13px;
    font-weight: 700;
    color: #4b5563;
    line-height: 1.5;
}


/* EMPTY */

.file-placeholder,
.no-results {
    background: white;
    padding: 30px 20px;
    text-align: center;
    border-radius: 11px;
    color: #6b7280;
    font-weight: 600;
}


/* FOOTER */

footer {
    text-align: center;
    padding: 30px 15px;
    color: #6b7280;
    font-size: 14px;
    font-weight: 600;
}


/* MOBILE */

@media (max-width: 600px) {

    header h1 {
        font-size: 25px;
    }

    header p {
        font-size: 14px;
    }

    .container {
        padding: 12px;
    }

    .folder {
        padding: 18px 15px;
    }

    .folder-title {
        font-size: 17px;
    }

    .path {
        font-size: 14px;
    }

}

</style>

</head>


<body>


<header>

    <h1>PCB REPAIR DATA</h1>

    <p>PCB REPAIR DATABASE</p>

</header>


<div class="search-area">

    <input
        id="searchBox"
        class="search-box"
        type="search"
        placeholder="Search IC, error code, brand, model..."
        autocomplete="off">

</div>


<div class="container">

    <button
        id="backButton"
        class="back-button"
        type="button">

        ← Back

    </button>


    <div
        id="pathDisplay"
        class="path">

        📁 Home

    </div>


    <div id="content"></div>

</div>


<footer>

    PCB REPAIR DATABASE

</footer>


<script>


/* =========================================================
   FOLDER CREATOR
========================================================= */

function makeFolders(names) {

    const result = {};

    names.forEach(function(name) {

        result[name] = {};

    });

}


/* =========================================================
   CATEGORIES
========================================================= */

const acTypes = [

    "Non Inverter Split",

    "Non Inverter Ductable"

const fridgeTypes = [

    "Inverter Double Door",
    "Inverter Triple Door",
    "Inverter Side by Side",

    "Non Inverter Single Door",
    "Non Inverter Double Door",
    "Non Inverter Triple Door",
    "Non Inverter Side by Side"

];


const washingMachineTypes = [

    "Inverter Top Load",
    "Inverter Front Load",

    "Non Inverter Top Load",
    "Non Inverter Front Load"

];


const microwaveTypes = [

    "Inverter",
    "Non Inverter"

];


/* =========================================================
   AC
========================================================= */

const AC = {

    "Circuit Diagrams":
        makeFolders(acTypes),

    "EEPROM BIN Files":
        makeFolders(acTypes),

    "Error Codes":
        makeFolders(acTypes),

    "Inverter AC": {

        "Window": {},
        "Split": {},
        "Cassette": {},
        "Ductable": {}

    },

    "Non Inverter AC": {

        "Window": {},
        "Split": {},
        "Cassette": {},
        "Ductable": {}

    },

    "PDF":
        makeFolders(acTypes),

    "Photos":
        makeFolders(acTypes),

    "Remote Photos":
        makeFolders(acTypes),

    "Sensor Details":
        makeFolders(acTypes),

/* =========================================================

const Fridge = {

        "Inverter Single Door": {},
        "Inverter Double Door": {},

    "Photos":

    "Sensor Details":

    "Signal PCB":

        makeFolders(fridgeTypes),

};


/* =========================================================

========================================================= */

const WashingMachine = {

    "Circuit Diagrams":

    "EEPROM BIN Files":
        makeFolders(washingMachineTypes),

    "Error Codes":
        makeFolders(washingMachineTypes),

    "Photos":
        makeFolders(washingMachineTypes),

    "Test Points":
        makeFolders(washingMachineTypes),

    "Videos":
        makeFolders(washingMachineTypes),

    "Wiring Details":
        makeFolders(washingMachineTypes)

};


/* =========================================================
   MICROWAVE
========================================================= */

const MicrowaveOven = {

    "MW Oven Touch":
        makeFolders(microwaveTypes),

    "MW Oven Wiring":
        makeFolders(microwaveTypes)

};


/* =========================================================
   INDUCTION
========================================================= */

const InductionCooktop = {

    "Circuit Diagrams": {},
    "Error Codes": {},
    "Photos": {},
    "Videos": {},
    "Test Points": {},
    "Wiring Details": {},
    "PDF": {}

};


/* =========================================================
   CHIMNEY
========================================================= */

const ChimneyPCB = {

    "Circuit Diagrams": {},
    "Error Codes": {},
    "Photos": {},
    "Videos": {},
    "Test Points": {},
    "Wiring Details": {},
    "PDF": {}

};

   RO
========================================================= */

const ROPCB = {

    "Circuit Diagrams": {},

    "EEPROM BIN Files": {},
    "Photos": {},
    "Videos": {},
    "Test Points": {},
    "Wiring Details": {},
    "Sensor Details": {},
    "PDF": {}

};


/* =========================================================
   CIRCUIT DIAGRAMS
========================================================= */

const CircuitDiagrams = {

    "AC":
        makeFolders(acTypes),

    "Fridge":
        makeFolders(fridgeTypes),

    "Washing Machine":
        makeFolders(washingMachineTypes),

    "Microwave Oven":
        makeFolders(microwaveTypes),

    "Induction Cooktop": {},

    "Chimney PCB": {},

    "R O PCB": {}

};


/* =========================================================
   PCB TEST POINTS
========================================================= */

const PCBTestPoints = {

    "AC":
        makeFolders(acTypes),

    "Fridge":
        makeFolders(fridgeTypes),

    "Washing Machine":
        makeFolders(washingMachineTypes)

};


/* =========================================================
   PHOTOS
========================================================= */

const Photos = {

    "AC":
        makeFolders(acTypes),

    "Fridge":
        makeFolders(fridgeTypes),

    "Washing Machine":
        makeFolders(washingMachineTypes),

    "Microwave Oven": {},

    "Induction Cooktop": {},

    "Chimney PCB": {},

    "R O PCB": {},

    "Misc": {}

};


/* =========================================================
   VIDEOS
========================================================= */

const Videos = {

    "AC":
        makeFolders(acTypes),

    "Fridge":
        makeFolders(fridgeTypes),

    "Washing Machine":
        makeFolders(washingMachineTypes),

    "Microwave Oven": {},

    "Induction Cooktop": {},

    "Chimney PCB": {},

    "R O PCB": {},

    "Misc": {}

};


/* =========================================================
   SOFTWARE DATA
========================================================= */

const SoftwareData = {

    "EEPROM Data": {

        "AC": {

            "Inverter Indoor PCB": {},
            "Non Inverter Indoor PCB": {},
            "Inverter ODU PCB": {},
            "Non Inverter ODU PCB": {}

        },

        "Fridge": {

            "Single Door": {

                "Inverter": {},
                "Non Inverter": {}

            },

            "Double Door": {

                "Inverter": {},
                "Non Inverter": {}

            },

            "Triple Door": {

                "Inverter": {},
                "Non Inverter": {}

            },

            "Side by Side": {

                "Inverter": {},
                "Non Inverter": {}

            },

            "Fridge Signal Card": {},

            "Fridge Inverter Card": {}

        },

        "Washing Machine": {

            "Inverter Top Load": {},
            "Inverter Front Load": {},
            "Non Inverter Top Load": {},
            "Non Inverter Front Load": {}

        }

    },

    "MCU Data": {}

};


/* =========================================================
   MAIN DATABASE
========================================================= */

const database = {

    "AC":
        AC,

    "Fridge":
        Fridge,

    "Washing Machine":
        WashingMachine,

    "Microwave Oven":
        MicrowaveOven,

    "Induction Cooktop":
        InductionCooktop,

    "Chimney PCB":
        ChimneyPCB,

    "R O PCB":
        ROPCB,

    "Circuit Diagrams":
        CircuitDiagrams,

    "Electronic Components":
        {},

    "Error Codes":
        {},

    "PCB Test Points":
        PCBTestPoints,

    "PDF":
        {},

    "Photos":
        Photos,

    "Software Data":
        SoftwareData,

    "Videos":
        Videos

};


/* =========================================================
   APP STATE
========================================================= */

let currentNode = database;

let currentPath = [];


/* =========================================================
   ELEMENTS
========================================================= */

const content =
    document.getElementById("content");

const pathDisplay =
    document.getElementById("pathDisplay");

const backButton =
    document.getElementById("backButton");

const searchBox =
    document.getElementById("searchBox");


/* =========================================================
   ENCODE PATH
========================================================= */

function encodePath(path) {

    return path
        .map(function(item) {

            return encodeURIComponent(item);

        })
        .join("/");

}


/* =========================================================
   DECODE PATH
========================================================= */

function decodePath() {

    const hash =
        window.location.hash;


    if (
        !hash ||
        hash === "#"
    ) {

        return [];

    }


    const raw =
        hash.substring(1);


    if (!raw) {

        return [];

    }


    return raw
        .split("/")
        .map(function(item) {

            return decodeURIComponent(item);

        });

}


/* =========================================================
   CHANGE URL PATH
========================================================= */

function setURLPath(path) {

    const newHash =
        encodePath(path);


    if (
        window.location.hash.substring(1)
        === newHash
    ) {

        return;

    }


    window.location.hash =
        newHash;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================================================
   REBUILD CURRENT NODE
========================================================= */

function rebuildFromPath(path) {

    currentNode =
        database;

    currentPath = [];


    for (
        let i = 0;
        i < path.length;
        i++
    ) {

        const name =
            path[i];


        if (
            !currentNode ||

            !Object.prototype.hasOwnProperty.call(
                currentNode,
                name
            )
        ) {

            currentNode =
                database;

            currentPath = [];

            return;

        }


        currentNode =
            currentNode[name];


        currentPath.push(name);

    }

}


/* =========================================================
   UPDATE TREE
========================================================= */

function updatePath() {

    if (
        currentPath.length === 0
    ) {

        pathDisplay.innerHTML = `

            <span class="path-home">

                📁 Home

            </span>

        `;

        return;

    }


    let html = `

        <span class="path-home">

            📁 Home

        </span>

    `;


    currentPath.forEach(function(name) {

        html += `

            <span class="path-arrow">

                →

            </span>

            <span class="path-item">

                ${escapeHTML(name)}

            </span>

        `;

    });


    pathDisplay.innerHTML =
        html;

}


/* =========================================================
   UPDATE BACK BUTTON
========================================================= */

function updateBackButton() {

    if (
        currentPath.length === 0
    ) {

        backButton.style.display =
            "none";

    } else {

        backButton.style.display =
            "inline-block";

    }

}


/* =========================================================
   SHOW FOLDER
========================================================= */

function showCurrentFolder() {

    content.innerHTML = "";


    updatePath();

    updateBackButton();


    const folderNames =
        Object.keys(currentNode);


    if (
        folderNames.length === 0
    ) {

        content.innerHTML = `

            <div class="file-placeholder">

                📂 This folder is currently empty.

            </div>

        `;

        return;

    }


    folderNames.forEach(function(folderName) {

        const folder =
            document.createElement("div");


        folder.className =
            "folder";


        folder.innerHTML = `

            <div class="folder-title">

                📁 ${escapeHTML(folderName)}

            </div>

        `;


        folder.addEventListener(
            "click",
            function() {

                openFolder(folderName);

            }
        );


        content.appendChild(folder);

    });

}


/* =========================================================
   OPEN FOLDER
========================================================= */

function openFolder(folderName) {

    const newPath =
        currentPath.concat(folderName);


    /*
       Hash navigation creates a real browser
       history entry.

       Therefore phone Back works.
    */

    setURLPath(newPath);

}


/* =========================================================
   APP BACK BUTTON
========================================================= */

backButton.addEventListener(
    "click",
    function() {

        if (
            currentPath.length === 0
        ) {

            return;

        }


        /*
           Remove one folder level.
        */

        const parentPath =
            currentPath.slice(
                0,
                currentPath.length - 1
            );


        setURLPath(parentPath);

    }
);


/* =========================================================
   PHONE / BROWSER BACK
========================================================= */

window.addEventListener(
    "hashchange",
    function() {

        const path =
            decodePath();


        rebuildFromPath(path);


        searchBox.value =
            "";


        showCurrentFolder();


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }
);


/* =========================================================
   SEARCH TREE
========================================================= */

function searchTree(
    node,
    path,
    text,
    results
) {

    if (
        !node ||
        typeof node !== "object"
    ) {

        return;

    }


    Object.keys(node).forEach(
        function(name) {

            const newPath =
                path.concat(name);


            if (
                name
                    .toLowerCase()
                    .includes(text)
            ) {

                results.push({

                    name: name,

                    path: newPath

                });

            }


            if (
                node[name] &&
                typeof node[name] === "object"
            ) {

                searchTree(

                    node[name],

                    newPath,

                    text,

                    results

                );

            }

        }
    );

}


/* =========================================================
   SEARCH
========================================================= */

function performSearch(text) {

    text =
        text.trim().toLowerCase();


    if (!text) {

        showCurrentFolder();

        return;

    }


    const results = [];


    searchTree(

        database,

        [],

        text,

        results

    );


    content.innerHTML = "";


    pathDisplay.innerHTML = `

        <span class="path-item">

            🔎 Search Results

        </span>

    `;


    updateBackButton();


    if (
        results.length === 0
    ) {

        content.innerHTML = `

            <div class="no-results">

                No matching folder found.

            </div>

        `;

        return;

    }


    results.forEach(
        function(result) {

            const item =
                document.createElement("div");


            item.className =
                "folder";


            item.innerHTML = `

                <div class="folder-title">

                    📁 ${escapeHTML(
                        result.name
                    )}

                </div>

                <div class="result-path">

                    ${escapeHTML(
                        result.path.join(
                            " → "
                        )
                    )}

                </div>

            `;


            item.addEventListener(
                "click",
                function() {

                    setURLPath(
                        result.path
                    );


                    searchBox.value =
                        "";

                }
            );


            content.appendChild(item);

        }
    );

}


/* =========================================================
   SEARCH EVENT
========================================================= */

searchBox.addEventListener(
    "input",
    function() {

        performSearch(
            this.value
        );

    }
);


/* =========================================================
   START APPLICATION
========================================================= */

const initialPath =
    decodePath();


rebuildFromPath(
    initialPath
);


showCurrentFolder();


</script>

</body>

</html>
